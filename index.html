    S.t = tSim;
    const k = pistonKinematics(tSim);
    S.pistonX = k.x; S.pistonV = k.v; S.firing = tSim < P.pushMs;
    const dt = chooseDt();
    wgpuParams(i, dt);
    dts.push(dt); tSim += dt; simmed += dt;
  }
  S.t = savedT; S.pistonX = savedX; S.pistonV = savedV; S.firing = savedF;
  dev.queue.writeBuffer(B.params, 0, WG.paramHost, 0, n * PARAM_STRIDE);

  const nF = (S.Nz + 1), nFr = (S.Nr + 1);
  const nJx = Math.ceil(S.Nz / 64);

  const enc = dev.createCommandEncoder();
  const pass = enc.beginComputePass();
  for (let i = 0; i < n; i++){
    const off = [i * PARAM_STRIDE];
    const bg = () => WG.bgF[(WG.velPar ? 4 : 0) | (WG.prePar ? 2 : 0) | (WG.dyePar ? 1 : 0)];
    pass.setBindGroup(0, WG.bgP, off);

    pass.setBindGroup(1, bg()); wgDispatch(pass, WG.pipe.advectVel, nF, nFr, 8, 8); WG.velPar ^= 1;
    pass.setBindGroup(1, bg()); wgDispatch(pass, WG.pipe.vorticity, nF, nFr, 8, 8);
    pass.setBindGroup(1, bg()); wgDispatch(pass, WG.pipe.forces,    nF, nFr, 8, 8); WG.velPar ^= 1;
    pass.setBindGroup(1, bg()); wgDispatch(pass, WG.pipe.divergence, S.Nz, S.Nr, 8, 8);
    pass.setBindGroup(1, bg()); wgDispatch(pass, WG.pipe.prepare,    S.Nz, S.Nr, 8, 8);
    for (let j = 0; j < P.iters; j++){
      pass.setBindGroup(1, bg());
      pass.setPipeline(WG.pipe.jacobiSimple);
      pass.dispatchWorkgroups(nJx, S.Nr);
      WG.prePar ^= 1;
    }
    pass.setBindGroup(1, bg()); wgDispatch(pass, WG.pipe.project, nF, nFr, 8, 8); WG.velPar ^= 1;
    pass.setBindGroup(1, bg()); wgDispatch(pass, WG.pipe.advectDye, S.Nz, S.Nr, 8, 8); WG.dyePar ^= 1;
  }

  // max |u| reduction + probe column, on the final state
  pass.setBindGroup(0, WG.bgP, [(n - 1) * PARAM_STRIDE]);
  pass.setBindGroup(1, WG.bgF[(WG.velPar ? 4 : 0) | (WG.prePar ? 2 : 0) | (WG.dyePar ? 1 : 0)]);
  pass.setPipeline(WG.pipe.probeGather);
  pass.dispatchWorkgroups(Math.ceil((S.Nr + 1) / 64));

  pass.setPipeline(WG.pipe.reduceMax);
  WG.redLevels.forEach((L, i) => {
    pass.setBindGroup(0, WG.bgRP, [i * PARAM_STRIDE]);
    pass.setBindGroup(1, WG.bgRed[i][i === 0 ? WG.velPar : 0]);
    pass.dispatchWorkgroups(Math.ceil(L.n / 256));
  });
  pass.end();

  const last = WG.redLevels[WG.redLevels.length - 1];
  // Capture the staging buffers and the grid generation now: a rebuild may swap both out
  // before this readback resolves, and unmapping the wrong buffer corrupts the next submit.
  const sMax = WG.stageMax, sProbe = WG.stageProbe, gen = WG.gen, nr = S.Nr;
  if (!WG.mapBusy){
    enc.copyBufferToBuffer(last.out, 0, sMax, 0, 8);
    enc.copyBufferToBuffer(WG.buf.probe, 0, sProbe, 0, (nr + 1) * 4);
  }
  dev.queue.submit([enc.finish()]);

  if (!WG.mapBusy){
    WG.mapBusy = true;
    const tag = S.t + simmed;
    Promise.all([sMax.mapAsync(GPUMapMode.READ),
                 sProbe.mapAsync(GPUMapMode.READ)]).then(() => {
      const m  = new Float32Array(sMax.getMappedRange().slice(0));
      const pr = new Float32Array(sProbe.getMappedRange().slice(0));
      sMax.unmap(); sProbe.unmap();
      if (gen !== WG.gen) return;            // stale sample from a grid that no longer exists
      WG.mapBusy = false;
      if (!Number.isFinite(m[0]) || !Number.isFinite(m[1]) || Math.max(m[0], m[1]) > 5000){
        flagDivergence(Math.max(m[0], m[1]));
      } else {
        S.vrmax = Math.max(m[0], 0.05);
        S.vzmax = Math.max(m[1], 0.05);
        S.vmax  = Math.max(m[0], m[1], 0.05);
      }
      consumeProbeArr(pr, tag);
    }).catch(() => { if (gen === WG.gen) WG.mapBusy = false; });
  }

  S.t += simmed;
  const k = pistonKinematics(S.t);
  S.pistonX = k.x; S.pistonV = k.v; S.firing = S.t < P.pushMs;
  return simmed;
}

/* probe buffer is a plain u_z column, not the interleaved RGBA the GL path reads */
function consumeProbeArr(buf, t){
  const axis = buf[0];
  let mx = 0, Q = 0, mom = 0;
  for (let ir = 0; ir < S.Nr; ir++){
    const uz = buf[ir];
    if (!Number.isFinite(uz)) continue;
    if (Math.abs(uz) > Math.abs(mx)) mx = uz;
    const rc = (ir + 0.5) * S.dr, dA = 2 * Math.PI * rc * S.dr;
    if (uz > 0){ Q += uz * dA; mom += uz * uz * dA; }
  }
  S.meas = { axis, mx, Q, mom };
  if (mx > S.peak){ S.peak = mx; S.peakT = t; }
  if (S.arrival < 0 && mx > 0.25) S.arrival = t;
  S.series.push([t, axis, mx]);
  if (S.series.length > 4000) S.series.splice(0, 2000);
}

function wgpuReset(){
  const dev = WG.dev;
  wgpuParams(0, 0.01);
  dev.queue.writeBuffer(WG.buf.params, 0, WG.paramHost, 0, PARAM_STRIDE);
  WG.velPar = 0; WG.prePar = 0; WG.dyePar = 0;
  const enc = dev.createCommandEncoder();
  const pass = enc.beginComputePass();
  pass.setBindGroup(0, WG.bgP, [0]);
  const bg = () => WG.bgF[(WG.velPar ? 4 : 0) | (WG.prePar ? 2 : 0) | (WG.dyePar ? 1 : 0)];
  // clearAll writes velD/preD/vor/div; run it for both parities so every buffer is zeroed
  for (let i = 0; i < 2; i++){
    pass.setBindGroup(1, bg());
    wgDispatch(pass, WG.pipe.clearAll, S.Nz + 1, S.Nr + 1, 8, 8);
    WG.velPar ^= 1; WG.prePar ^= 1;
  }
  for (let i = 0; i < 2; i++){
    pass.setBindGroup(1, bg());
    wgDispatch(pass, WG.pipe.dyeInit, S.Nz, S.Nr, 8, 8);
    WG.dyePar ^= 1;
  }
  pass.end();
  dev.queue.submit([enc.finish()]);
}

function wgpuRender(targetView, outW, outH){
  const dev = WG.dev;
  const cv = WG.canvas;
  const w = cv.width, h = cv.height;
  S.colourScale = activeColourScale();
  const su = new Float32Array(8);
  su[0] = outW || w; su[1] = outH || h; su[2] = VIEW.field; su[3] = S.colourScale;
  su[4] = VIEW.showGeom ? 1 : 0;
  su[5] = Math.min(S.Lz - S.dz, S.Z1 + P.plateT + P.probe);
  dev.queue.writeBuffer(WG.buf.showU, 0, su);

  const enc = dev.createCommandEncoder();
  const pass = enc.beginRenderPass({ colorAttachments:[{
    view: targetView || WG.ctx.getCurrentTexture().createView(),
    clearValue:{ r:0.02, g:0.03, b:0.04, a:1 }, loadOp:'clear', storeOp:'store' }] });
  pass.setPipeline(WG.pipe.show);
  pass.setBindGroup(0, WG.bgP, [0]);
  pass.setBindGroup(1, WG.bgFS[(WG.velPar ? 4 : 0) | (WG.prePar ? 2 : 0) | (WG.dyePar ? 1 : 0)]);
  pass.setBindGroup(2, WG.bgS);
  pass.draw(3);
  pass.end();
  dev.queue.submit([enc.finish()]);
}
</script>

<script>
"use strict";
/* ==========================================================================
   Compressible solver — axisymmetric Navier–Stokes, density-based.

   Conserved state U = (rho, rho*u_z, rho*u_r, E) as cell averages on a finite
   volume grid. Fluxes from an HLLC approximate Riemann solver with MUSCL
   reconstruction and a minmod limiter, advanced by SSP-RK2. This carries real
   acoustics, so it chokes, forms shocks and cannot exceed the physical exit
   velocity the way the incompressible solver could.

   Two things make this workable where a naive Godunov scheme would not:

   1. A low-Mach correction (Thornber et al. 2008) on the reconstructed
      velocities. Standard upwind flux has dissipation that grows like 1/M, so
      without this it would shred the vortex ring at M ~ 0.02 -- exactly the
      case this tool exists to study.
   2. Reflecting-wall Riemann fluxes rather than ghost cells, which stays
      robust across the moving piston boundary.

   Units are mm, ms, microgram: velocity comes out in m/s, density in kg/m^3
   and pressure in Pa, all consistent and all order-one to order-1e5.
   ========================================================================== */

const AIR = {
  gamma: 1.4,
  R:     287.0,          // J/(kg K)
  T0:    293.0,          // K
  p0:    101325.0,       // Pa
  Pr:    0.72,
};
AIR.rho0 = AIR.p0 / (AIR.R * AIR.T0);            // 1.205 kg/m^3
AIR.a0   = Math.sqrt(AIR.gamma * AIR.R * AIR.T0); // 343 m/s
AIR.E0   = AIR.p0 / (AIR.gamma - 1);

const WGSL_COMP = `
struct Params {
  cells : vec2<i32>,
  faces : vec2<i32>,
  d     : vec2<f32>,
  dtlz  : vec2<f32>,
  geoA  : vec4<f32>,
  geoB  : vec4<f32>,
  pist  : vec4<f32>,
  flu   : vec4<f32>,
  misc  : vec4<f32>,
  gas   : vec4<f32>,          // gamma, rho0, p0, stage weight
  gas2  : vec4<f32>,          // a0, spongeWidth, Pr, _
};
@group(0) @binding(0) var<uniform> P : Params;

@group(1) @binding(0) var<storage, read>       Ua : array<vec4<f32>>;   // U^n
@group(1) @binding(1) var<storage, read_write> Ub : array<vec4<f32>>;   // stage target
@group(1) @binding(2) var<storage, read>       Da : array<f32>;         // rho*Y
@group(1) @binding(3) var<storage, read_write> Db : array<f32>;
@group(1) @binding(4) var<storage, read_write> Fz : array<vec4<f32>>;
@group(1) @binding(5) var<storage, read_write> Fr : array<vec4<f32>>;
@group(1) @binding(6) var<storage, read_write> wav : array<vec2<f32>>;
@group(1) @binding(7) var<storage, read_write> probeB : array<f32>;
@group(1) @binding(8) var<storage, read>       Uold : array<vec4<f32>>; // U^n for RK stage 2
@group(1) @binding(9) var<storage, read>       Dold : array<f32>;

const FLUID : i32 = 0;
const WALL  : i32 = 1;
const PISTON: i32 = 2;
/* Positivity floors, kept relative to the ambient state rather than absolute: an absolute
   1 Pa floor is invisible for air at 101325 Pa but silently clamps a non-dimensional test. */
fn GAM() -> f32 { return P.gas.x; }
fn RHO_FLOOR() -> f32 { return 1.0e-6 * P.gas.y; }
fn P_FLOOR() -> f32 { return 1.0e-6 * P.gas.z; }

fn solidAt(p : vec2<f32>) -> i32 {
  if (P.misc.z > 0.5) { return FLUID; }          // validation mode: empty domain
  let z = p.x; let r = p.y;
  if (z >= P.pist.x && z <= P.pist.y && r <= P.pist.z) { return PISTON; }
  let outR = P.geoA.w + P.geoB.x;
  if (z >= P.geoA.y && z <= P.geoA.z + P.geoB.z && r <= outR) {
    var rin : f32;
    let taper = P.geoB.w; let z1 = P.geoA.z;
    if (z <= z1 - taper) { rin = P.geoA.w; }
    else if (z <= z1) {
      if (taper > 0.0) { rin = mix(P.geoA.w, P.geoB.y, (z - (z1 - taper)) / taper); }
      else { rin = P.geoA.w; }
    } else { rin = P.geoB.y; }
    if (r >= rin) { return WALL; }
  }
  return FLUID;
}
fn solidCell(iz : i32, ir : i32) -> i32 {
  return solidAt(vec2<f32>((f32(iz) + 0.5) * P.d.x, (f32(ir) + 0.5) * P.d.y));
}
fn cIdx(iz : i32, ir : i32) -> u32 {
  let z = clamp(iz, 0, P.cells.x - 1);
  let r = clamp(ir, 0, P.cells.y - 1);
  return u32(r * P.cells.x + z);
}
fn Uat(iz : i32, ir : i32) -> vec4<f32> { return Ua[cIdx(iz, ir)]; }

fn toPrim(u : vec4<f32>) -> vec4<f32> {          // -> (rho, uz, ur, p)
  let rho = max(u.x, RHO_FLOOR());
  let uz = u.y / rho; let ur = u.z / rho;
  let p = max((GAM() - 1.0) * (u.w - 0.5 * rho * (uz * uz + ur * ur)), P_FLOOR());
  return vec4<f32>(rho, uz, ur, p);
}
fn toCons(w : vec4<f32>) -> vec4<f32> {
  return vec4<f32>(w.x, w.x * w.y, w.x * w.z,
                   w.w / (GAM() - 1.0) + 0.5 * w.x * (w.y * w.y + w.z * w.z));
}
fn Wat(iz : i32, ir : i32) -> vec4<f32> { return toPrim(Uat(iz, ir)); }

fn minmod(a : f32, b : f32) -> f32 {
  if (a * b <= 0.0) { return 0.0; }
  if (abs(a) < abs(b)) { return a; }
  return b;
}
fn mm4(a : vec4<f32>, b : vec4<f32>) -> vec4<f32> {
  return vec4<f32>(minmod(a.x, b.x), minmod(a.y, b.y), minmod(a.z, b.z), minmod(a.w, b.w));
}

/* HLLC, in a frame where .y is the wall-normal velocity and .z the tangential one. */
fn hllc(wL : vec4<f32>, wR : vec4<f32>) -> vec4<f32> {
  let g = GAM();
  let rL = wL.x; let unL = wL.y; let utL = wL.z; let pL = wL.w;
  let rR = wR.x; let unR = wR.y; let utR = wR.z; let pR = wR.w;
  let aL = sqrt(g * pL / rL); let aR = sqrt(g * pR / rR);
  let EL = pL / (g - 1.0) + 0.5 * rL * (unL * unL + utL * utL);
  let ER = pR / (g - 1.0) + 0.5 * rR * (unR * unR + utR * utR);
  let SL = min(unL - aL, unR - aR);
  let SR = max(unL + aL, unR + aR);
  if (SL >= 0.0) {
    return vec4<f32>(rL * unL, rL * unL * unL + pL, rL * unL * utL, (EL + pL) * unL);
  }
  if (SR <= 0.0) {
    return vec4<f32>(rR * unR, rR * unR * unR + pR, rR * unR * utR, (ER + pR) * unR);
  }
  let den = rL * (SL - unL) - rR * (SR - unR);
  var Ss = 0.0;
  if (abs(den) > 1e-12) {
    Ss = (pR - pL + rL * unL * (SL - unL) - rR * unR * (SR - unR)) / den;
  }
  if (Ss >= 0.0) {
    let FL = vec4<f32>(rL * unL, rL * unL * unL + pL, rL * unL * utL, (EL + pL) * unL);
    let f = rL * (SL - unL) / (SL - Ss);
    let Us = vec4<f32>(f, f * Ss, f * utL,
              f * (EL / rL + (Ss - unL) * (Ss + pL / (rL * (SL - unL)))));
    return FL + SL * (Us - vec4<f32>(rL, rL * unL, rL * utL, EL));
  }
  let FR = vec4<f32>(rR * unR, rR * unR * unR + pR, rR * unR * utR, (ER + pR) * unR);
  let f = rR * (SR - unR) / (SR - Ss);
  let Us = vec4<f32>(f, f * Ss, f * utR,
            f * (ER / rR + (Ss - unR) * (Ss + pR / (rR * (SR - unR)))));
  return FR + SR * (Us - vec4<f32>(rR, rR * unR, rR * utR, ER));
}

/* Thornber's low-Mach reconstruction fix. Plain upwinding has dissipation that
   grows like 1/M; without this the vortex ring dissolves at the Mach numbers
   this device actually runs at. */
fn lowMach(wL : ptr<function, vec4<f32>>, wR : ptr<function, vec4<f32>>) {
  let g = GAM();
  let aL = sqrt(g * (*wL).w / (*wL).x);
  let aR = sqrt(g * (*wR).w / (*wR).x);
  let ML = length(vec2<f32>((*wL).y, (*wL).z)) / aL;
  let MR = length(vec2<f32>((*wR).y, (*wR).z)) / aR;
  let zf = min(1.0, max(ML, MR));
  let un = 0.5 * ((*wL).y + (*wR).y); let dn = 0.5 * ((*wL).y - (*wR).y) * zf;
  let ut = 0.5 * ((*wL).z + (*wR).z); let dt2 = 0.5 * ((*wL).z - (*wR).z) * zf;
  (*wL).y = un + dn; (*wR).y = un - dn;
  (*wL).z = ut + dt2; (*wR).z = ut - dt2;
}

/* A wall is handled by reflecting the fluid state through it and letting the
   Riemann solver produce the flux. For the piston the reflection is about the
   wall's own velocity, which gives the moving-wall pressure work for free. */
fn reflectN(w : vec4<f32>, vwall : f32) -> vec4<f32> {
  return vec4<f32>(w.x, 2.0 * vwall - w.y, w.z, w.w);
}
`;

const WGSL_COMP_K = WGSL_COMP + `
fn wallVelZ(s : i32) -> f32 { if (s == PISTON) { return P.pist.w; } return 0.0; }

/* ---- axial faces: iz in [0, Nz], ir in [0, Nr) ---- */
@compute @workgroup_size(64, 1)
fn fluxZ(@builtin(global_invocation_id) g : vec3<u32>) {
  let iz = i32(g.x); let ir = i32(g.y);
  if (iz > P.cells.x || ir >= P.cells.y) { return; }
  let fi = u32(ir * (P.cells.x + 1) + iz);

  var sL = WALL; var sR = WALL;
  if (iz > 0)            { sL = solidCell(iz - 1, ir); }
  if (iz < P.cells.x)    { sR = solidCell(iz, ir); }
  if (iz == 0)           { sL = solidCell(0, ir); }             // open end: mirror the interior
  if (iz == P.cells.x)   { sR = solidCell(P.cells.x - 1, ir); }

  if (sL != FLUID && sR != FLUID) { Fz[fi] = vec4<f32>(0.0); return; }

  var wL : vec4<f32>; var wR : vec4<f32>;
  if (sL != FLUID) {                                   // wall on the left
    wR = Wat(iz, ir);
    wL = reflectN(wR, wallVelZ(sL));
  } else if (sR != FLUID) {                            // wall on the right
    wL = Wat(iz - 1, ir);
    wR = reflectN(wL, wallVelZ(sR));
  } else if (iz == 0 || iz == P.cells.x) {             // open boundary: zero gradient
    let w = Wat(min(iz, P.cells.x - 1), ir);
    wL = w; wR = w;
  } else {
    let wm1 = Wat(iz - 1, ir); let w0 = Wat(iz, ir);
    var wm2 = Wat(iz - 2, ir); var wp1 = Wat(iz + 1, ir);
    if (iz - 2 < 0 || solidCell(iz - 2, ir) != FLUID) { wm2 = wm1; }
    if (iz + 1 >= P.cells.x || solidCell(iz + 1, ir) != FLUID) { wp1 = w0; }
    wL = wm1 + 0.5 * mm4(wm1 - wm2, w0 - wm1);
    wR = w0  - 0.5 * mm4(w0 - wm1, wp1 - w0);
    lowMach(&wL, &wR);
  }
  wL.x = max(wL.x, RHO_FLOOR()); wR.x = max(wR.x, RHO_FLOOR());
  wL.w = max(wL.w, P_FLOOR());   wR.w = max(wR.w, P_FLOOR());
  Fz[fi] = hllc(wL, wR);
}

/* ---- radial faces: iz in [0, Nz), ir in [0, Nr] ---- */
@compute @workgroup_size(64, 1)
fn fluxR(@builtin(global_invocation_id) g : vec3<u32>) {
  let iz = i32(g.x); let ir = i32(g.y);
  if (iz >= P.cells.x || ir > P.cells.y) { return; }
  let fi = u32(ir * P.cells.x + iz);
  if (ir == 0) { Fr[fi] = vec4<f32>(0.0); return; }     // axis: face area is zero

  var sL = WALL; var sR = WALL;
  if (ir > 0)          { sL = solidCell(iz, ir - 1); }
  if (ir < P.cells.y)  { sR = solidCell(iz, ir); }
  if (ir == P.cells.y) { sR = solidCell(iz, P.cells.y - 1); }

  if (sL != FLUID && sR != FLUID) { Fr[fi] = vec4<f32>(0.0); return; }

  var wL : vec4<f32>; var wR : vec4<f32>;
  if (sL != FLUID) {
    wR = Wat(iz, ir).xzyw;                             // (rho, ur, uz, p): normal first
    wL = reflectN(wR, 0.0);                            // every radial wall here is static
  } else if (sR != FLUID) {
    wL = Wat(iz, ir - 1).xzyw;
    wR = reflectN(wL, 0.0);
  } else if (ir == P.cells.y) {
    let w = Wat(iz, P.cells.y - 1).xzyw;
    wL = w; wR = w;
  } else {
    let wm1 = Wat(iz, ir - 1).xzyw; let w0 = Wat(iz, ir).xzyw;
    var wm2 = Wat(iz, ir - 2).xzyw; var wp1 = Wat(iz, ir + 1).xzyw;
    if (ir - 2 < 0 || solidCell(iz, ir - 2) != FLUID) { wm2 = wm1; }
    if (ir + 1 >= P.cells.y || solidCell(iz, ir + 1) != FLUID) { wp1 = w0; }
    wL = wm1 + 0.5 * mm4(wm1 - wm2, w0 - wm1);
    wR = w0  - 0.5 * mm4(w0 - wm1, wp1 - w0);
    lowMach(&wL, &wR);
  }
  wL.x = max(wL.x, RHO_FLOOR()); wR.x = max(wR.x, RHO_FLOOR());
  wL.w = max(wL.w, P_FLOOR());   wR.w = max(wR.w, P_FLOOR());
  Fr[fi] = hllc(wL, wR).xzyw;                          // back to (rho, rho*uz, rho*ur, E)
}

/* ---- viscous stress and conduction, central differences at cell centres ---- */
fn muEff(iz : i32, ir : i32, rho : f32) -> f32 {
  var nu = P.flu.x;
  if (P.flu.w > 0.0) {                                  // Smagorinsky sub-grid
    let dz = P.d.x; let dr = P.d.y;
    let rc = (f32(ir) + 0.5) * dr;
    let wp = Wat(iz + 1, ir); let wm = Wat(iz - 1, ir);
    let wn = Wat(iz, ir + 1); let ws = Wat(iz, ir - 1);
    let w0 = Wat(iz, ir);
    let duzdz = (wp.y - wm.y) / (2.0 * dz);
    let durdr = (wn.z - ws.z) / (2.0 * dr);
    let duzdr = (wn.y - ws.y) / (2.0 * dr);
    let durdz = (wp.z - wm.z) / (2.0 * dz);
    let stt = w0.z / max(rc, 1e-6);
    let srz = 0.5 * (duzdr + durdz);
    let s2 = 2.0 * (duzdz * duzdz + durdr * durdr + stt * stt) + 4.0 * srz * srz;
    let dd = sqrt(dz * dr);
    nu = nu + P.flu.w * P.flu.w * dd * dd * sqrt(max(s2, 0.0));
  }
  return rho * nu;
}

@compute @workgroup_size(8, 8)
fn update(@builtin(global_invocation_id) g : vec3<u32>) {
  let iz = i32(g.x); let ir = i32(g.y);
  if (iz >= P.cells.x || ir >= P.cells.y) { return; }
  let k = u32(ir * P.cells.x + iz);
  let dz = P.d.x; let dr = P.d.y; let dt = P.dtlz.x;
  let rc = (f32(ir) + 0.5) * dr;
  let s = solidCell(iz, ir);

  if (s != FLUID) {
    // Keep solid cells holding a plausible state so that a cell the piston uncovers
    // starts from something sane rather than stale garbage.
    var acc = vec2<f32>(0.0); var n = 0.0;
    for (var q = 0; q < 4; q++) {
      var jz = iz; var jr = ir;
      if (q == 0) { jz = iz - 1; } else if (q == 1) { jz = iz + 1; }
      else if (q == 2) { jr = ir - 1; } else { jr = ir + 1; }
      if (jz >= 0 && jz < P.cells.x && jr >= 0 && jr < P.cells.y && solidCell(jz, jr) == FLUID) {
        let w = Wat(jz, jr); acc = acc + vec2<f32>(w.x, w.w); n = n + 1.0;
      }
    }
    var rho = P.gas.y; var pr = P.gas.z;
    if (n > 0.0) { rho = acc.x / n; pr = acc.y / n; }
    var vz = 0.0;
    if (s == PISTON) { vz = P.pist.w; }
    Ub[k] = toCons(vec4<f32>(rho, vz, 0.0, pr));
    Db[k] = 0.0;
    return;
  }

  let fzL = Fz[u32(ir * (P.cells.x + 1) + iz)];
  let fzR = Fz[u32(ir * (P.cells.x + 1) + iz + 1)];
  let frL = Fr[u32(ir * P.cells.x + iz)];
  let frR = Fr[u32((ir + 1) * P.cells.x + iz)];
  let rL = f32(ir) * dr; let rR = f32(ir + 1) * dr;

  let w0 = Wat(iz, ir);
  var L = -(fzR - fzL) / dz - (rR * frR - rL * frL) / (rc * dr);
  L.z = L.z + w0.w / rc;                                // axisymmetric pressure source

  // ---- viscous terms ----
  if (P.flu.x > 0.0 || P.flu.w > 0.0) {
    let mu = muEff(iz, ir, w0.x);
    let wp = Wat(iz + 1, ir); let wm = Wat(iz - 1, ir);
    let wn = Wat(iz, ir + 1); let ws = Wat(iz, ir - 1);
    let dz2 = dz * dz; let dr2 = dr * dr;
    let lapz = (wp.y - 2.0 * w0.y + wm.y) / dz2
             + ((rR * (wn.y - w0.y) - rL * (w0.y - ws.y)) / (rc * dr2));
    let lapr = (wp.z - 2.0 * w0.z + wm.z) / dz2
             + ((rR * (wn.z - w0.z) - rL * (w0.z - ws.z)) / (rc * dr2))
             - w0.z / (rc * rc);
    L.y = L.y + mu * lapz;
    L.z = L.z + mu * lapr;
    // viscous heating plus conduction (Pr constant, cp = gamma R / (gamma - 1))
    let duzdz = (wp.y - wm.y) / (2.0 * dz);
    let durdr = (wn.z - ws.z) / (2.0 * dr);
    let duzdr = (wn.y - ws.y) / (2.0 * dr);
    let durdz = (wp.z - wm.z) / (2.0 * dz);
    let divu = duzdz + durdr + w0.z / rc;
    let phi = mu * (2.0 * (duzdz * duzdz + durdr * durdr + (w0.z / rc) * (w0.z / rc))
                    + (duzdr + durdz) * (duzdr + durdz) - (2.0 / 3.0) * divu * divu);
    let Rg = 287.0;
    let cp = P.gas.x * Rg / (P.gas.x - 1.0);
    let kt = mu * cp / P.gas2.w;
    let T0c = w0.w / (w0.x * Rg);
    let Tp = wp.w / (wp.x * Rg); let Tm = wm.w / (wm.x * Rg);
    let Tn = wn.w / (wn.x * Rg); let Ts = ws.w / (ws.x * Rg);
    let lapT = (Tp - 2.0 * T0c + Tm) / dz2
             + ((rR * (Tn - T0c) - rL * (T0c - Ts)) / (rc * dr2));
    L.w = L.w + phi + kt * lapT + mu * (w0.y * lapz + w0.z * lapr);
  }

  let wgt = P.gas.w;
  var Un = (1.0 - wgt) * (Ua[k] + dt * L) + wgt * Uold[k];

  // ---- passive tracer, carried by the mass flux with an upwind mass fraction ----
  let Yl = Da[cIdx(iz - 1, ir)] / max(Wat(iz - 1, ir).x, RHO_FLOOR());
  let Y0 = Da[k] / max(w0.x, RHO_FLOOR());
  let Yr = Da[cIdx(iz + 1, ir)] / max(Wat(iz + 1, ir).x, RHO_FLOOR());
  let Yd = Da[cIdx(iz, ir - 1)] / max(Wat(iz, ir - 1).x, RHO_FLOOR());
  let Yu = Da[cIdx(iz, ir + 1)] / max(Wat(iz, ir + 1).x, RHO_FLOOR());
  var yzL = Y0; if (fzL.x >= 0.0) { yzL = Yl; }
  var yzR = Y0; if (fzR.x <  0.0) { yzR = Yr; }
  var yrL = Y0; if (frL.x >= 0.0) { yrL = Yd; }
  var yrR = Y0; if (frR.x <  0.0) { yrR = Yu; }
  let Ld = -(fzR.x * yzR - fzL.x * yzL) / dz
           - (rR * frR.x * yrR - rL * frL.x * yrL) / (rc * dr);
  var Dn = (1.0 - wgt) * (Da[k] + dt * Ld) + wgt * Dold[k];
  Dn = Dn * exp(-P.flu.z * dt);

  // ---- sponge: absorb outgoing acoustics so the open boundaries do not ring ----
  let sz = P.gas2.y; let sr = P.gas2.z;
  let zc = (f32(iz) + 0.5) * dz;
  var sig = 0.0;
  if (zc < sz)                { sig = max(sig, 1.0 - zc / sz); }
  if (zc > P.dtlz.y - sz)     { sig = max(sig, 1.0 - (P.dtlz.y - zc) / sz); }
  if (rc > P.geoA.x - sr)     { sig = max(sig, 1.0 - (P.geoA.x - rc) / sr); }
  if (sig > 0.0) {
    let amb = toCons(vec4<f32>(P.gas.y, 0.0, 0.0, P.gas.z));
    let a = clamp(sig * sig * dt * P.gas2.x / max(sz, 1e-6), 0.0, 1.0);
    Un = mix(Un, amb, a);
    Dn = mix(Dn, 0.0, a);
  }

  Un.x = max(Un.x, RHO_FLOOR());
  Ub[k] = Un;
  Db[k] = clamp(Dn, 0.0, Un.x);
}

@compute @workgroup_size(8, 8)
fn waveSpeed(@builtin(global_invocation_id) g : vec3<u32>) {
  let iz = i32(g.x); let ir = i32(g.y);
  if (iz >= P.cells.x || ir >= P.cells.y) { return; }
  let k = u32(ir * P.cells.x + iz);
  if (solidCell(iz, ir) != FLUID) { wav[k] = vec2<f32>(0.0); return; }
  let w = toPrim(Ua[k]);
  let a = sqrt(P.gas.x * w.w / w.x);
  let sp = (abs(w.y) + a) / P.d.x + (abs(w.z) + a) / P.d.y;
  let mach = length(vec2<f32>(w.y, w.z)) / a;
  wav[k] = vec2<f32>(sp, mach);
}

@compute @workgroup_size(8, 8)
fn initState(@builtin(global_invocation_id) g : vec3<u32>) {
  let iz = i32(g.x); let ir = i32(g.y);
  if (iz >= P.cells.x || ir >= P.cells.y) { return; }
  let k = u32(ir * P.cells.x + iz);
  let p = vec2<f32>((f32(iz) + 0.5) * P.d.x, (f32(ir) + 0.5) * P.d.y);
  Ub[k] = toCons(vec4<f32>(P.gas.y, 0.0, 0.0, P.gas.z));
  let inBarrel = solidAt(p) == FLUID && p.x > P.geoA.y && p.x < P.geoA.z + P.geoB.z
                 && p.y < P.geoA.w;
  var d = 0.0;
  if (inBarrel) { d = P.gas.y; }
  Db[k] = d;
}

@compute @workgroup_size(64)
fn probeGather(@builtin(global_invocation_id) g : vec3<u32>) {
  let ir = i32(g.x);
  if (ir >= P.cells.y) { return; }
  let iz = clamp(i32(P.misc.y), 0, P.cells.x - 1);
  let w = toPrim(Ua[u32(ir * P.cells.x + iz)]);
  probeB[u32(ir)] = w.y;
}

/* Seeding tracer just ahead of the piston face while it is pushing. */
@compute @workgroup_size(8, 8)
fn seedDye(@builtin(global_invocation_id) g : vec3<u32>) {
  let iz = i32(g.x); let ir = i32(g.y);
  if (iz >= P.cells.x || ir >= P.cells.y) { return; }
  if (i32(P.misc.x) != 1) { return; }
  let k = u32(ir * P.cells.x + iz);
  let p = vec2<f32>((f32(iz) + 0.5) * P.d.x, (f32(ir) + 0.5) * P.d.y);
  if (p.y <= P.pist.z && p.x >= P.pist.y && p.x <= P.pist.y + 3.0 && solidAt(p) == FLUID) {
    Db[k] = toPrim(Ub[k]).x;
  }
}
`;

const WGSL_COMP_SHOW = `
struct Params {
  cells : vec2<i32>, faces : vec2<i32>, d : vec2<f32>, dtlz : vec2<f32>,
  geoA : vec4<f32>, geoB : vec4<f32>, pist : vec4<f32>, flu : vec4<f32>,
  misc : vec4<f32>, gas : vec4<f32>, gas2 : vec4<f32>,
};
@group(0) @binding(0) var<uniform> P : Params;
@group(1) @binding(0) var<storage, read> Ua : array<vec4<f32>>;
@group(1) @binding(1) var<storage, read> Da : array<f32>;
struct Show { viewport : vec2<f32>, field : f32, scale : f32,
              showGeom : f32, probeZ : f32, _p : vec2<f32> };
@group(2) @binding(0) var<uniform> SH : Show;

const FLUID : i32 = 0; const WALL : i32 = 1; const PISTON : i32 = 2;

fn solidAt(p : vec2<f32>) -> i32 {
  let z = p.x; let r = p.y;
  if (z >= P.pist.x && z <= P.pist.y && r <= P.pist.z) { return PISTON; }
  let outR = P.geoA.w + P.geoB.x;
  if (z >= P.geoA.y && z <= P.geoA.z + P.geoB.z && r <= outR) {
    var rin : f32; let taper = P.geoB.w; let z1 = P.geoA.z;
    if (z <= z1 - taper) { rin = P.geoA.w; }
    else if (z <= z1) {
      if (taper > 0.0) { rin = mix(P.geoA.w, P.geoB.y, (z - (z1 - taper)) / taper); }
      else { rin = P.geoA.w; }
    } else { rin = P.geoB.y; }
    if (r >= rin) { return WALL; }
  }
  return FLUID;
}
fn cIdx(iz : i32, ir : i32) -> u32 {
  return u32(clamp(ir, 0, P.cells.y - 1) * P.cells.x + clamp(iz, 0, P.cells.x - 1));
}
fn prim(iz : i32, ir : i32) -> vec4<f32> {
  let u = Ua[cIdx(iz, ir)];
  let rho = max(u.x, 1.0e-4);
  let uz = u.y / rho; let ur = u.z / rho;
  let p = max((P.gas.x - 1.0) * (u.w - 0.5 * rho * (uz * uz + ur * ur)), 1.0);
  return vec4<f32>(rho, uz, ur, p);
}
@vertex fn vs(@builtin(vertex_index) vi : u32) -> @builtin(position) vec4<f32> {
  let v = vec2<f32>(f32((vi << 1u) & 2u), f32(vi & 2u));
  return vec4<f32>(v * 2.0 - 1.0, 0.0, 1.0);
}
fn viridis(t0 : f32) -> vec3<f32> {
  let t = clamp(t0, 0.0, 1.0);
  let c0=vec3<f32>(0.2777,0.0054,0.3341); let c1=vec3<f32>(0.1051,1.4046,1.3846);
  let c2=vec3<f32>(-0.3309,0.2148,0.0951); let c3=vec3<f32>(-4.6342,-5.7991,-19.3324);
  let c4=vec3<f32>(6.2283,14.1799,56.6906); let c5=vec3<f32>(4.7764,-13.7451,-65.3530);
  let c6=vec3<f32>(-5.4355,4.6459,26.3124);
  return clamp(c0+t*(c1+t*(c2+t*(c3+t*(c4+t*(c5+t*c6))))), vec3<f32>(0.0), vec3<f32>(1.0));
}
fn diverging(t : f32) -> vec3<f32> {
  let a = clamp(abs(t), 0.0, 1.0);
  var c = vec3<f32>(1.0, 0.42, 0.25);
  if (t < 0.0) { c = vec3<f32>(0.25, 0.55, 1.0); }
  return mix(vec3<f32>(0.055, 0.07, 0.09), c, pow(a, 0.75));
}
@fragment fn fs(@builtin(position) fc : vec4<f32>) -> @location(0) vec4<f32> {
  let uv = vec2<f32>(fc.x / SH.viewport.x, 1.0 - fc.y / SH.viewport.y);
  let z = uv.x * P.dtlz.y;
  let rs = (uv.y - 0.5) * 2.0 * P.geoA.x;
  let r = abs(rs);
  let p2 = vec2<f32>(z, r);
  let iz = clamp(i32(floor(z / P.d.x)), 0, P.cells.x - 1);
  let ir = clamp(i32(floor(r / P.d.y)), 0, P.cells.y - 1);
  var col = vec3<f32>(0.055, 0.07, 0.09);
  let sld = solidAt(p2);
  let fld = i32(SH.field);
  if (sld == FLUID) {
    let w = prim(iz, ir);
    let a = sqrt(P.gas.x * w.w / w.x);
    let dye = clamp(Da[cIdx(iz, ir)] / w.x, 0.0, 1.0);
    if (fld == 0) {
      col = mix(col, vec3<f32>(0.86, 0.93, 1.0), pow(dye, 0.7));
    } else if (fld == 1) {
      col = viridis(length(vec2<f32>(w.y, w.z)) / max(SH.scale, 1e-6));
    } else if (fld == 2) {
      let wp = prim(iz + 1, ir); let wm = prim(iz - 1, ir);
      let wn = prim(iz, ir + 1); let ws = prim(iz, ir - 1);
      let vort = (wp.z - wm.z) / (2.0 * P.d.x) - (wn.y - ws.y) / (2.0 * P.d.y);
      var sgn = 1.0; if ((uv.y - 0.5) < 0.0) { sgn = -1.0; }
      col = diverging(clamp(sgn * vort / max(SH.scale, 1e-6), -1.0, 1.0));
    } else if (fld == 3) {
      col = diverging(clamp((w.w - P.gas.z) / max(SH.scale, 1e-6), -1.0, 1.0));
    } else if (fld == 4) {
      col = diverging(clamp(w.y / max(SH.scale, 1e-6), -1.0, 1.0));
    } else if (fld == 5) {
      // Mach, with a hard line at M = 1 so choking is visible
      let M = length(vec2<f32>(w.y, w.z)) / a;
      col = viridis(M / max(SH.scale, 1e-6));
      if (abs(M - 1.0) < 0.02) { col = vec3<f32>(1.0, 1.0, 1.0); }
    } else {
      // numerical schlieren: exp(-k |grad rho| / max) is how shocks are shown in practice
      let gz = (prim(iz + 1, ir).x - prim(iz - 1, ir).x) / (2.0 * P.d.x);
      let gr = (prim(iz, ir + 1).x - prim(iz, ir - 1).x) / (2.0 * P.d.y);
      let s = length(vec2<f32>(gz, gr)) / max(SH.scale, 1e-6);
      let v = 1.0 - exp(-3.0 * s);
      col = vec3<f32>(v, v, v);
    }
    if (fld != 0 && fld != 6) { col = mix(col, vec3<f32>(1.0), 0.16 * dye); }
  } else if (SH.showGeom > 0.5) {
    if (sld == PISTON) { col = vec3<f32>(0.83, 0.55, 0.20); }
    else { col = vec3<f32>(0.30, 0.35, 0.42); }
    if (fract((z * 0.5 + r * 0.5) / 3.0) < 0.5) { col = col + 0.04; }
  } else { col = vec3<f32>(0.10, 0.11, 0.13); }
  if (abs(uv.y - 0.5) * SH.viewport.y < 0.6) { col = mix(col, vec3<f32>(0.45,0.55,0.65), 0.5); }
  if (abs(z - SH.probeZ) < P.d.x * 0.6) { col = mix(col, vec3<f32>(1.0,0.85,0.35), 0.45); }
  return vec4<f32>(col, 1.0);
}
`;

/* ========================== compressible driver ========================== */
const CP = { ok:false, idx:0, machMax:0, waveMax:1 };

async function compInit(){
  if (!WG.dev) return false;
  const dev = WG.dev;
  const modK = dev.createShaderModule({ code: WGSL_COMP_K });
  const modS = dev.createShaderModule({ code: WGSL_COMP_SHOW });
  for (const m of [modK, modS]){
    const info = await m.getCompilationInfo();
    const bad = info.messages.filter(x => x.type === 'error');
    if (bad.length){
      console.error('compressible shader:', bad);
      wgpuFail('compressible kernels: ' + bad[0].message);
      return false;
    }
  }
  const st = (b, ro) => ({ binding:b, visibility:GPUShaderStage.COMPUTE,
                           buffer:{ type: ro ? 'read-only-storage' : 'storage' } });
  CP.bglF = dev.createBindGroupLayout({ entries:[
    st(0,true), st(1,false), st(2,true), st(3,false), st(4,false),
    st(5,false), st(6,false), st(7,false), st(8,true), st(9,true) ] });
  const sr = b => ({ binding:b, visibility:GPUShaderStage.FRAGMENT,
                     buffer:{ type:'read-only-storage' } });
  CP.bglS = dev.createBindGroupLayout({ entries:[ sr(0), sr(1) ] });

  const plK = dev.createPipelineLayout({ bindGroupLayouts:[WG.bglP, CP.bglF] });
  const plS = dev.createPipelineLayout({ bindGroupLayouts:[WG.bglP, CP.bglS, WG.bglS] });
  CP.pipe = {};
  for (const n of ['fluxZ','fluxR','update','waveSpeed','initState','probeGather','seedDye'])
    CP.pipe[n] = dev.createComputePipeline({ layout:plK, compute:{ module:modK, entryPoint:n } });
  CP.pipe.show = dev.createRenderPipeline({ layout:plS,
    vertex:{ module:modS, entryPoint:'vs' },
    fragment:{ module:modS, entryPoint:'fs', targets:[{ format:WG.fmt }] },
    primitive:{ topology:'triangle-list' } });
  CP.ok = true;
  return true;
}

function compAlloc(){
  const dev = WG.dev;
  for (const k in (CP.buf || {})) if (CP.buf[k] && CP.buf[k].destroy) CP.buf[k].destroy();
  CP.buf = {};
  const nC = S.Nz * S.Nr;
  const SU = GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC | GPUBufferUsage.COPY_DST;
  const mk = (n, b) => dev.createBuffer({ size: Math.max(16, n * b), usage: SU });
  const B = CP.buf;
  B.U = [mk(nC,16), mk(nC,16), mk(nC,16)];
  B.D = [mk(nC,4),  mk(nC,4),  mk(nC,4)];
  B.Fz = mk((S.Nz + 1) * S.Nr, 16);
  B.Fr = mk(S.Nz * (S.Nr + 1), 16);
  B.wav = mk(nC, 8);
  B.probe = mk(S.Nr, 4);

  CP.bg = [];
  for (let i = 0; i < 3; i++){
    const a = i, b = (i + 1) % 3, c = (i + 2) % 3;
    const mkbg = (src, dst) => dev.createBindGroup({ layout:CP.bglF, entries:[
      { binding:0, resource:{ buffer:B.U[src] } }, { binding:1, resource:{ buffer:B.U[dst] } },
      { binding:2, resource:{ buffer:B.D[src] } }, { binding:3, resource:{ buffer:B.D[dst] } },
      { binding:4, resource:{ buffer:B.Fz } },     { binding:5, resource:{ buffer:B.Fr } },
      { binding:6, resource:{ buffer:B.wav } },    { binding:7, resource:{ buffer:B.probe } },
      { binding:8, resource:{ buffer:B.U[a] } },   { binding:9, resource:{ buffer:B.D[a] } } ]});
    CP.bg.push([mkbg(a, b), mkbg(b, c)]);
  }
  CP.bgS = [0,1,2].map(i => dev.createBindGroup({ layout:CP.bglS, entries:[
    { binding:0, resource:{ buffer:B.U[i] } }, { binding:1, resource:{ buffer:B.D[i] } } ]}));

  // reduction chain over cells (the incompressible one is sized for faces)
  CP.red = [];
  let n = nC;
  while (n > 1){
    const outN = Math.ceil(n / 256);
    CP.red.push({ n, out: mk(outN, 8) });
    n = outN;
  }
  const rp = new Uint32Array(PARAM_STRIDE * Math.max(1, CP.red.length) / 4);
  CP.red.forEach((L, i) => { rp[i * PARAM_FLOATS] = L.n; rp[i * PARAM_FLOATS + 1] = 0; });
  B.redParams = dev.createBuffer({ size: PARAM_STRIDE * Math.max(1, CP.red.length),
    usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
  dev.queue.writeBuffer(B.redParams, 0, rp);
  CP.bgRP = dev.createBindGroup({ layout:WG.bglRP, entries:[
    { binding:0, resource:{ buffer:B.redParams, size:16 } }] });
  CP.bgRed = CP.red.map((L, i) => dev.createBindGroup({ layout:WG.bglR, entries:[
    { binding:0, resource:{ buffer: i === 0 ? B.wav : CP.red[i-1].out } },
    { binding:1, resource:{ buffer:L.out } }]}));

  CP.stageMax   = dev.createBuffer({ size:8, usage:GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
  CP.stageProbe = dev.createBuffer({ size:Math.max(16, S.Nr * 4),
    usage:GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
  CP.mapBusy = false;
  CP.gen = (CP.gen || 0) + 1;
  CP.idx = 0;
  CP.waveMax = AIR.a0 * (1 / S.dz + 1 / S.dr);
  CP.machMax = 0;
}

const CTEST = { noGeom:false, noSponge:false, rho0:null, p0:null };
function compParams(slot, dt, weight){
  wgpuParams(slot, dt);                       // shared geometry / drive / fluid block
  const F = WG.paramF, o = slot * PARAM_FLOATS;
  F[o+26] = CTEST.noGeom ? 1 : 0;
  F[o+28] = AIR.gamma;
  F[o+29] = CTEST.rho0 !== null ? CTEST.rho0 : AIR.rho0;
  F[o+30] = CTEST.p0   !== null ? CTEST.p0   : AIR.p0;
  F[o+31] = weight;
  F[o+32] = AIR.a0;
  F[o+33] = CTEST.noSponge ? 0 : 0.08 * S.Lz;
  F[o+34] = CTEST.noSponge ? 0 : 0.12 * S.Rmax;
  F[o+35] = AIR.Pr;
}

function compChooseDt(){
  if (FIXED_DT !== null) return FIXED_DT;
  const cfl = Math.min(P.cfl, 0.6);           // MUSCL + SSP-RK2 acoustic limit
  return Math.min(0.5, cfl / Math.max(CP.waveMax, 1e-6));
}

function compReset(){
  const dev = WG.dev;
  compParams(0, 0.001, 0);
  dev.queue.writeBuffer(CP.buf.params || WG.buf.params, 0, WG.paramHost, 0, PARAM_STRIDE);
  const enc = dev.createCommandEncoder();
  const pass = enc.beginComputePass();
  pass.setBindGroup(0, WG.bgP, [0]);
  pass.setPipeline(CP.pipe.initState);
  for (let i = 0; i < 3; i++){
    pass.setBindGroup(1, CP.bg[i][0]);
    pass.dispatchWorkgroups(Math.ceil(S.Nz / 8), Math.ceil(S.Nr / 8));
  }
  pass.end();
  dev.queue.submit([enc.finish()]);
  CP.idx = 0;
  CP.waveMax = AIR.a0 * (1 / S.dz + 1 / S.dr);
  CP.machMax = 0;
}

function compSteps(n){
  const dev = WG.dev, B = CP.buf;
  n = Math.min(n, 1024);
  const dts = [];
  let tSim = S.t, simmed = 0;
  const sT = S.t, sX = S.pistonX, sV = S.pistonV, sF = S.firing;
  for (let i = 0; i < n; i++){
    S.t = tSim;
    const k = pistonKinematics(tSim);
    S.pistonX = k.x; S.pistonV = k.v; S.firing = tSim < P.pushMs;
    const dt = compChooseDt();
    compParams(2 * i,     dt, 0.0);           // RK stage 1
    compParams(2 * i + 1, dt, 0.5);           // RK stage 2
    dts.push(dt); tSim += dt; simmed += dt;
  }
  S.t = sT; S.pistonX = sX; S.pistonV = sV; S.firing = sF;
  dev.queue.writeBuffer(WG.buf.params, 0, WG.paramHost, 0, 2 * n * PARAM_STRIDE);

  const gz = Math.ceil((S.Nz + 1) / 64), gzc = Math.ceil(S.Nz / 64);
  const gc = [Math.ceil(S.Nz / 8), Math.ceil(S.Nr / 8)];
  const enc = dev.createCommandEncoder();
  const pass = enc.beginComputePass();

  for (let i = 0; i < n; i++){
    for (let stage = 0; stage < 2; stage++){
      pass.setBindGroup(0, WG.bgP, [(2 * i + stage) * PARAM_STRIDE]);
      pass.setBindGroup(1, CP.bg[CP.idx][stage]);
      pass.setPipeline(CP.pipe.fluxZ);  pass.dispatchWorkgroups(gz, S.Nr);
      pass.setPipeline(CP.pipe.fluxR);  pass.dispatchWorkgroups(gzc, S.Nr + 1);
      pass.setPipeline(CP.pipe.update); pass.dispatchWorkgroups(gc[0], gc[1]);
    }
    pass.setPipeline(CP.pipe.seedDye);  pass.dispatchWorkgroups(gc[0], gc[1]);
    CP.idx = (CP.idx + 2) % 3;
  }

  // wave speed and probe read the state that is now current
  pass.setBindGroup(0, WG.bgP, [(2 * n - 1) * PARAM_STRIDE]);
  pass.setBindGroup(1, CP.bg[CP.idx][0]);
  pass.setPipeline(CP.pipe.waveSpeed);   pass.dispatchWorkgroups(gc[0], gc[1]);
  pass.setPipeline(CP.pipe.probeGather); pass.dispatchWorkgroups(Math.ceil(S.Nr / 64));
  pass.setPipeline(WG.pipe.reduceMax);
  CP.red.forEach((L, i) => {
    pass.setBindGroup(0, CP.bgRP, [i * PARAM_STRIDE]);
    pass.setBindGroup(1, CP.bgRed[i]);
    pass.dispatchWorkgroups(Math.ceil(L.n / 256));
  });
  pass.end();

  const last = CP.red[CP.red.length - 1];
  const sMax = CP.stageMax, sProbe = CP.stageProbe, gen = CP.gen;
  if (!CP.mapBusy){
    enc.copyBufferToBuffer(last.out, 0, sMax, 0, 8);
    enc.copyBufferToBuffer(B.probe, 0, sProbe, 0, S.Nr * 4);
  }
  dev.queue.submit([enc.finish()]);

  if (!CP.mapBusy){
    CP.mapBusy = true;
    const tag = S.t + simmed;
    Promise.all([sMax.mapAsync(GPUMapMode.READ), sProbe.mapAsync(GPUMapMode.READ)]).then(() => {
      const m  = new Float32Array(sMax.getMappedRange().slice(0));
      const pr = new Float32Array(sProbe.getMappedRange().slice(0));
      sMax.unmap(); sProbe.unmap();
      if (gen !== CP.gen) return;
      CP.mapBusy = false;
      if (!Number.isFinite(m[0]) || m[0] <= 0){ flagDivergence(NaN); return; }
      CP.waveMax = m[0];
      CP.machMax = m[1];
      S.vmax = CP.machMax * AIR.a0;
      S.vzmax = S.vmax; S.vrmax = S.vmax;
      consumeProbeArr(pr, tag);
    }).catch(() => { if (gen === CP.gen) CP.mapBusy = false; });
  }

  S.t += simmed;
  const k = pistonKinematics(S.t);
  S.pistonX = k.x; S.pistonV = k.v; S.firing = S.t < P.pushMs;
  return simmed;
}

function compRender(targetView, outW, outH){
  const dev = WG.dev, cv = WG.canvas;
  S.colourScale = activeColourScale();
  const su = new Float32Array(8);
  su[0] = outW || cv.width; su[1] = outH || cv.height; su[2] = VIEW.field; su[3] = S.colourScale;
  su[4] = VIEW.showGeom ? 1 : 0;
  su[5] = Math.min(S.Lz - S.dz, S.Z1 + P.plateT + P.probe);
  dev.queue.writeBuffer(WG.buf.showU, 0, su);
  compParams(0, S.dt || 0.001, 0);
  dev.queue.writeBuffer(WG.buf.params, 0, WG.paramHost, 0, PARAM_STRIDE);

  const enc = dev.createCommandEncoder();
  const pass = enc.beginRenderPass({ colorAttachments:[{
    view: targetView || WG.ctx.getCurrentTexture().createView(),
    clearValue:{ r:0.02, g:0.03, b:0.04, a:1 }, loadOp:'clear', storeOp:'store' }] });
  pass.setPipeline(CP.pipe.show);
  pass.setBindGroup(0, WG.bgP, [0]);
  pass.setBindGroup(1, CP.bgS[CP.idx]);
  pass.setBindGroup(2, WG.bgS);
  pass.draw(3);
  pass.end();
  dev.queue.submit([enc.finish()]);
}
</script>

<script>
"use strict";
/* ==========================================================================
   Video export.

   The interactive solver picks its timestep adaptively, which is right on
   screen but wrong for video: frames would represent unequal slices of time
   and the motion would be subtly wrong. So export runs on a fixed schedule --
   every video frame advances exactly the same simulated interval, subdivided
   into however many equal sub-steps stability requires.

   WebCodecs gives encoded chunks but no container, so there is a minimal
   Matroska/WebM muxer below: one video track, SimpleBlocks in Clusters.
   ========================================================================== */

/* ---- EBML primitives ---- */
function ebmlVint(n){
  let len = 1;
  while (n >= Math.pow(2, 7 * len) - 1) len++;
  const b = new Uint8Array(len);
  let v = n;
  for (let i = len - 1; i >= 0; i--){ b[i] = v & 0xff; v = Math.floor(v / 256); }
  b[0] |= 1 << (8 - len);
  return b;
}
function ebmlUint(n){
  const out = [];
  let v = Math.round(n);
  do { out.unshift(v & 0xff); v = Math.floor(v / 256); } while (v > 0);
  return new Uint8Array(out);
}
function ebmlFloat(x){
  const b = new Uint8Array(8);
  new DataView(b.buffer).setFloat64(0, x, false);
  return b;
}
const ebmlStr = t => new TextEncoder().encode(t);
function bytesJoin(list){
  let n = 0; for (const a of list) n += a.length;
  const out = new Uint8Array(n);
  let o = 0; for (const a of list){ out.set(a, o); o += a.length; }
  return out;
}
function ebmlElem(id, data){
  const idb = new Uint8Array(id), sz = ebmlVint(data.length);
  return bytesJoin([idb, sz, data]);
}

function webmMux(frames, width, height, fps, codecId){
  const header = ebmlElem([0x1A,0x45,0xDF,0xA3], bytesJoin([
    ebmlElem([0x42,0x86], ebmlUint(1)),
    ebmlElem([0x42,0xF7], ebmlUint(1)),
    ebmlElem([0x42,0xF2], ebmlUint(4)),
    ebmlElem([0x42,0xF3], ebmlUint(8)),
    ebmlElem([0x42,0x82], ebmlStr('webm')),
    ebmlElem([0x42,0x87], ebmlUint(2)),
    ebmlElem([0x42,0x85], ebmlUint(2)),
  ]));
  const durMs = frames.length * 1000 / fps;
  const info = ebmlElem([0x15,0x49,0xA9,0x66], bytesJoin([
    ebmlElem([0x2A,0xD7,0xB1], ebmlUint(1000000)),          // 1 ms timecode scale
    ebmlElem([0x4D,0x80], ebmlStr('airzooka')),
    ebmlElem([0x57,0x41], ebmlStr('airzooka')),
    ebmlElem([0x44,0x89], ebmlFloat(durMs)),
  ]));
  const tracks = ebmlElem([0x16,0x54,0xAE,0x6B], ebmlElem([0xAE], bytesJoin([
    ebmlElem([0xD7], ebmlUint(1)),
    ebmlElem([0x73,0xC5], ebmlUint(1)),
    ebmlElem([0x83], ebmlUint(1)),                          // video
    ebmlElem([0x9C], ebmlUint(0)),                          // no lacing
    ebmlElem([0x86], ebmlStr(codecId)),
    ebmlElem([0x23,0xE3,0x83], ebmlUint(Math.round(1e9 / fps))),
    ebmlElem([0xE0], bytesJoin([
      ebmlElem([0xB0], ebmlUint(width)),
      ebmlElem([0xBA], ebmlUint(height)),
    ])),
  ])));

  const clusters = [];
  let cur = null, curTime = 0;
  const flushCluster = () => {
    if (!cur || !cur.length) return;
    clusters.push(ebmlElem([0x1F,0x43,0xB6,0x75],
      bytesJoin([ebmlElem([0xE7], ebmlUint(curTime)), ...cur])));
    cur = null;
  };
  for (const f of frames){
    const tMs = Math.round(f.timestamp / 1000);
    // a cluster must start on a keyframe, and its block offsets are a signed 16-bit ms
    if (!cur || (f.key && tMs - curTime > 1000) || tMs - curTime > 30000){
      flushCluster(); cur = []; curTime = tMs;
    }
    const tn = ebmlVint(1);
    const blk = new Uint8Array(tn.length + 3 + f.data.length);
    blk.set(tn, 0);
    new DataView(blk.buffer).setInt16(tn.length, tMs - curTime, false);
    blk[tn.length + 2] = f.key ? 0x80 : 0x00;
    blk.set(f.data, tn.length + 3);
    cur.push(ebmlElem([0xA3], blk));
  }
  flushCluster();

  const segment = ebmlElem([0x18,0x53,0x80,0x67], bytesJoin([info, tracks, ...clusters]));
  return new Blob([header, segment], { type:'video/webm' });
}

/* ---- fixed-timestep advance ---------------------------------------------
   FIXED_DT overrides the adaptive chooser. Each video frame covers exactly
   msPerFrame of flight, split into equal sub-steps small enough for stability.
   The sub-step count may vary between frames; the frame interval never does. */
async function currentDtLimit(){
  const dev = WG.dev;
  if (!dev) return 0.01;
  await dev.queue.onSubmittedWorkDone();
  const src = usingComp() ? CP.red[CP.red.length-1].out : WG.redLevels[WG.redLevels.length-1].out;
  if (!EXP.readBuf) EXP.readBuf = dev.createBuffer({ size:8,
    usage:GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
  const enc = dev.createCommandEncoder();
  enc.copyBufferToBuffer(src, 0, EXP.readBuf, 0, 8);
  dev.queue.submit([enc.finish()]);
  await EXP.readBuf.mapAsync(GPUMapMode.READ);
  const m = new Float32Array(EXP.readBuf.getMappedRange().slice(0));
  EXP.readBuf.unmap();
  if (usingComp()){
    if (Number.isFinite(m[0]) && m[0] > 0) CP.waveMax = m[0];
    if (Number.isFinite(m[1])) { CP.machMax = m[1]; S.vmax = m[1]*AIR.a0; }
    return compChooseDt();
  }
  if (Number.isFinite(m[0])) S.vrmax = Math.max(m[0], 0.05);
  if (Number.isFinite(m[1])) S.vzmax = Math.max(m[1], 0.05);
  S.vmax = Math.max(S.vrmax, S.vzmax);
  return chooseDt();
}

async function advanceExactly(ms){
  const limit = Math.max(await currentDtLimit(), 1e-9);
  const nSub = Math.max(1, Math.ceil(ms / limit));
  FIXED_DT = ms / nSub;
  let left = nSub;
  const batch = usingComp() ? 512 : 1024;
  while (left > 0){
    const n = Math.min(left, batch);
    if (usingComp()) compSteps(n); else if (WG.ok) wgpuSteps(n);
    else { for (let i = 0; i < n; i++) step(FIXED_DT); }
    left -= n;
  }
  FIXED_DT = null;
  return nSub;
}

/* ---- the exporter ---- */
const EXP = { running:false, cancel:false, scale:null, readBuf:null, tex:null, buf:null, tw:0, th:0 };

/* A WebGPU canvas does not present until a task boundary, so drawImage() straight after
   submit() yields a blank frame. Render into our own texture and copy it out instead:
   deterministic, and it works at any resolution without touching the visible canvas. */
async function exportGrab(w, h){
  const dev = WG.dev;
  if (!WG.ok){
    canvas.width = w; canvas.height = h;
    render();
    const px = new Uint8Array(w * h * 4);
    gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, px);
    const out = new Uint8ClampedArray(w * h * 4);          // GL origin is bottom-left
    for (let y = 0; y < h; y++) out.set(px.subarray((h-1-y)*w*4, (h-y)*w*4), y*w*4);
    return out;
  }
  if (!EXP.tex || EXP.tw !== w || EXP.th !== h){
    if (EXP.tex) EXP.tex.destroy();
    if (EXP.buf) EXP.buf.destroy();
    EXP.tex = dev.createTexture({ size:[w, h], format:WG.fmt,
      usage:GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_SRC });
    EXP.bpr = Math.ceil(w * 4 / 256) * 256;                // copy rows must be 256-aligned
    EXP.buf = dev.createBuffer({ size:EXP.bpr * h,
      usage:GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
    EXP.tw = w; EXP.th = h;
  }
  const view = EXP.tex.createView();
  if (usingComp()) compRender(view, w, h); else wgpuRender(view, w, h);
  const enc = dev.createCommandEncoder();
  enc.copyTextureToBuffer({ texture:EXP.tex },
    { buffer:EXP.buf, bytesPerRow:EXP.bpr, rowsPerImage:h }, [w, h, 1]);
  dev.queue.submit([enc.finish()]);
  await EXP.buf.mapAsync(GPUMapMode.READ);
  const src = new Uint8Array(EXP.buf.getMappedRange());
  const out = new Uint8ClampedArray(w * h * 4);
  const swap = WG.fmt === 'bgra8unorm';
  for (let y = 0; y < h; y++){
    const so = y * EXP.bpr, dof = y * w * 4;
    for (let x = 0; x < w; x++){
      const a = so + x*4, b = dof + x*4;
      if (swap){ out[b] = src[a+2]; out[b+1] = src[a+1]; out[b+2] = src[a]; }
      else      { out[b] = src[a];   out[b+1] = src[a+1]; out[b+2] = src[a+2]; }
      out[b+3] = 255;
    }
  }
  EXP.buf.unmap();
  return out;
}

function expLog(msg){
  const el = document.getElementById('expStatus');
  if (el) el.innerHTML = msg;
}

async function exportVideo(){
  if (EXP.running) { EXP.cancel = true; return; }
  if (typeof VideoEncoder === 'undefined'){
    expLog('<span style="color:var(--bad)">This browser has no WebCodecs VideoEncoder.</span>');
    return;
  }
  const flightMs   = P.vidFlight;
  const fps        = Math.round(P.vidFps);
  const msPerFrame = P.vidMsPerFrame;
  const total      = Math.max(1, Math.round(flightMs / msPerFrame));
  const width      = Math.round(P.vidWidth / 2) * 2;

  // Labels live in bands above and below the image, never on top of it, so no backing
  // panel is needed and nothing can obscure the flow.
  const sc      = Math.max(1, width / 900);
  const headerH = Math.round(40 * sc);
  const footerH = Math.round(52 * sc);
  const simH    = Math.max(2, Math.round(width * (2 * S.Rmax) / S.Lz));
  const height  = Math.round((simH + headerH + footerH) / 2) * 2;

  EXP.running = true; EXP.cancel = false; EXP.scale = null;
  const btn = document.getElementById('expBtn');
  btn.textContent = 'Cancel export';
  const wasRunning = S.running;
  S.running = false;
  EXPORTING = true;

  const comp = document.createElement('canvas');
  comp.width = width; comp.height = height;
  const cx = comp.getContext('2d');

  const frames = [];
  let encoder = null, encErr = null;
  const codec = 'vp09.00.10.08', codecId = 'V_VP9';
  try {
    // ---- pass 1: find the peak, so the colour scale can be fixed for the whole clip ----
    if (P.vidPrepass){
      buildGrid();
      let peak = 0;
      for (let i = 0; i < total; i++){
        if (EXP.cancel) break;
        await advanceExactly(msPerFrame);
        peak = Math.max(peak, S.vmax);
        if (i % 8 === 0){
          expLog(`scanning for the colour range — ${((i+1)/total*100).toFixed(0)}%`);
          await new Promise(r => setTimeout(r, 0));
        }
      }
      EXP.scale = colourScaleFor(Math.max(peak, 1e-6));
    } else {
      EXP.scale = colourScaleFor(S.vmax);
    }
    if (EXP.cancel) throw new Error('cancelled');

    encoder = new VideoEncoder({
      output: (chunk) => {
        const buf = new Uint8Array(chunk.byteLength);
        chunk.copyTo(buf);
        frames.push({ data:buf, timestamp:chunk.timestamp, key:chunk.type === 'key' });
      },
      error: (e) => { encErr = e; },
    });
    encoder.configure({ codec, width, height,
      bitrate: Math.round(P.vidMbps * 1e6), framerate: fps, latencyMode:'quality' });

    // ---- pass 2: the recording proper, from the same initial state ----
    buildGrid();
    await new Promise(r => setTimeout(r, 0));

    const t0 = performance.now();
    for (let i = 0; i < total; i++){
      if (EXP.cancel || encErr) break;
      const nSub = await advanceExactly(msPerFrame);
      const px = await exportGrab(width, simH);

      cx.fillStyle = '#0b0e13';
      cx.fillRect(0, 0, width, height);
      cx.putImageData(new ImageData(px, width, simH), 0, headerH);
      drawOverlay(cx, width, height, headerH, simH, footerH, sc);

      const vf = new VideoFrame(comp, {
        timestamp: Math.round(i * 1e6 / fps),
        duration: Math.round(1e6 / fps),
      });
      encoder.encode(vf, { keyFrame: i % Math.max(1, fps * 2) === 0 });
      vf.close();
      while (encoder.encodeQueueSize > 6) await new Promise(r => setTimeout(r, 1));

      if (i % 5 === 0 || i === total - 1){
        const el = performance.now() - t0;
        const eta = (el / (i + 1)) * (total - i - 1) / 1000;
        expLog(`encoding ${i+1}/${total} (${((i+1)/total*100).toFixed(0)}%) · ` +
               `${nSub} sub-steps · t = ${S.t.toFixed(2)} ms · ${eta.toFixed(0)} s left`);
        await new Promise(r => setTimeout(r, 0));
      }
    }
    await encoder.flush();
  } catch (e){
    if (!/cancelled/.test(e.message || '')) encErr = e;
  } finally {
    if (encoder && encoder.state !== 'closed') { try { encoder.close(); } catch(e){} }
    EXPORTING = false; EXP.scale = null;
    EXP.running = false;
    btn.textContent = 'Export video';
    S.running = wasRunning;
    resizeCanvas();
  }

  if (encErr){
    expLog(`<span style="color:var(--bad)">Encoder error: ${encErr.message || encErr}</span>`);
    return;
  }
  if (!frames.length){ expLog('Cancelled — nothing written.'); return; }

  const blob = webmMux(frames, width, height, fps, codecId);
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `airzooka_${Math.round(P.exitR*10)/10}mm_${flightMs}ms.webm`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 30000);
  expLog(`Done — ${frames.length} frames, ${(blob.size/1e6).toFixed(1)} MB, ` +
         `${(frames.length/fps).toFixed(1)} s of video.`);
}

/* Labels go in the bands above and below the image, so nothing is drawn over the flow and
   no semi-transparent backing panel is needed. */
function drawOverlay(cx, w, h, headerH, simH, footerH, sc){
  const f = Math.round(13 * sc);
  cx.fillStyle = '#dfe6ee';
  cx.font = `${f}px ui-monospace, SFMono-Regular, Menlo, monospace`;
  cx.textBaseline = 'middle';
  cx.textAlign = 'left';
  const pad = Math.round(10 * sc);
  cx.fillText(`t = ${S.t.toFixed(2)} ms`, pad, headerH * 0.32);
  cx.fillStyle = '#8b97a6';
  cx.font = `${Math.round(11 * sc)}px ui-monospace, SFMono-Regular, Menlo, monospace`;
  cx.fillText(`${usingComp() ? 'compressible Navier–Stokes' : 'incompressible'} · ` +
              `bore ${fmt(P.boreR,1)} mm · exit ${fmt(P.exitR,1)} mm · ` +
              `stroke ${fmt(Math.min(P.stroke, maxStroke()),0)} mm · L/D ${fmt(derived().LD,2)}`,
              pad, headerH * 0.72);

  const fy = headerH + simH;
  const legW = Math.min(Math.round(260 * sc), Math.round(w * 0.42));
  paintLegend(cx, pad, fy + Math.round(6*sc), legW, footerH - Math.round(12*sc),
              S.colourScale || 1, Math.round(11 * sc));

  // physical scale bar, on a round number of millimetres
  const pxPerMm = w / S.Lz;
  let barMm = Math.pow(10, Math.floor(Math.log10(S.Lz / 5)));
  if (barMm * pxPerMm < w * 0.08) barMm *= 2;
  if (barMm * pxPerMm > w * 0.30) barMm /= 2;
  const bw = barMm * pxPerMm;
  const bx = w - pad - bw, by = fy + footerH * 0.62;
  cx.strokeStyle = '#dfe6ee'; cx.fillStyle = '#dfe6ee';
  cx.lineWidth = Math.max(1, Math.round(1.5 * sc));
  const tick = Math.round(5 * sc);
  cx.beginPath();
  cx.moveTo(bx, by - tick); cx.lineTo(bx, by); cx.lineTo(bx + bw, by); cx.lineTo(bx + bw, by - tick);
  cx.stroke();
  cx.textAlign = 'center'; cx.textBaseline = 'top';
  cx.font = `${Math.round(11 * sc)}px ui-monospace, SFMono-Regular, Menlo, monospace`;
  cx.fillText(`${barMm >= 1 ? barMm : barMm.toFixed(1)} mm`, bx + bw/2, by + Math.round(3*sc));
  cx.textAlign = 'left'; cx.textBaseline = 'alphabetic';
}

</script>

{

  for (const pr of PRESETS){
    const b = document.createElement('button');
    b.innerHTML = `<b>${pr.n}</b><i>${pr.d}</i>`;
    b.addEventListener('click', () => {
      Object.assign(P, pr.p);
      if (pr.auto === 'ld4')
        P.exitR = Math.round(Math.cbrt(P.boreR*P.boreR*Math.min(P.stroke, maxStroke())/8) * 2) / 2;
      syncSliders();
      buildGrid(); scheduleURLSync(true); updateMetrics();
    });
    row.appendChild(b);
  }
  host.appendChild(d);
}

function syncSliders(){
  for (const k in sliders){
    const s = sliders[k];
    s.inp.value = P[k];
    P[k] = parseFloat(s.inp.value);          // re-read so clamping to slider range applies
    s.out.textContent = fmtVal(s.it, P[k]);
  }
}

document.getElementById('note').innerHTML =
  `<b>↻</b> marks parameters that rebuild the grid and restart the shot.
   <b>Enter</b> fires, <b>space</b> pauses.<br><br>
   Geometry comes from <code>airzooker.scad</code>. The flange and the handle greebles sit outside
   the flow and are not modelled; the barrel is treated as open at the back so air can refill
   behind the piston.<br><br>
   <b>What to trust.</b> This is an <i>axisymmetric</i> solver, so it forms and propagates vortex
   <i>rings</i> properly — a plain planar 2D solver gives vortex pairs that behave quite
   differently. Ring formation, pinch-off and the L/D physics are the parts worth believing.<br><br>
   <b>What not to trust.</b> Absolute range is optimistic. A real jet breaks up through 3-D
   instabilities that circular symmetry forbids by construction, so without help the jet here
   stays laminar and flies too far. The Smagorinsky term is a stand-in for that missing mixing,
   not a substitute for it. The solver is also incompressible, so any design whose exit speed
   approaches Mach 0.3 is outside what it can model. Use it to rank designs against each other,
   not to predict metres.`;

/* ==========================================================================
   Shareable links. State lives in the fragment rather than the query string:
   the fragment never reaches a server, and assigning location.hash works on
   file:// URLs, where Chrome throws on history.replaceState.
   Only values that differ from the defaults are written, so a typical link
   carries a handful of keys. With every setting changed it comes to roughly
   320 characters, against a commonly-cited safe limit of 2000.
   ========================================================================== */
const URLKEY = {
  boreR:'br', wallT:'wt', barrelLen:'bl', exitR:'er', plateT:'pt', taper:'tp',
  pistonT:'ph', pistonClr:'pc', stroke:'st', pushMs:'pd',
  visc:'nu', smag:'cs', vortEps:'vc', dyeDiss:'dd',
  downrange:'dn', zAspect:'za', res:'rs', iters:'it', cfl:'cf', budget:'bg', spf:'sp',
  probe:'pb',
};
const URLKEY_INV = Object.fromEntries(Object.entries(URLKEY).map(([a,b]) => [b,a]));
const MODEL_CODE = { auto:0, incompressible:1, compressible:2 };
const MODEL_NAME = ['auto','incompressible','compressible'];

const trimNum = v => String(Number(v.toFixed(5)));

function encodeState(){
  const out = [];
  for (const k in URLKEY){
    // compare at the slider's own granularity: a default that is not exactly representable
    // on its slider would otherwise appear in every link
    if (Math.abs(P[k] - DEFAULTS[k]) > (SPEC[k].step || 1e-9) * 0.5) {
      out.push(URLKEY[k] + '=' + trimNum(P[k]));
    }
  }
  if (OPT.model !== 'auto')  out.push('md=' + MODEL_CODE[OPT.model]);
  if (!OPT.autoPace)         out.push('ap=0');
  if (VIEW.field !== 0)      out.push('fd=' + VIEW.field);
  if (Math.abs(VIEW.gain - 1) > 1e-6) out.push('gn=' + trimNum(VIEW.gain));
  if (!VIEW.showGeom)        out.push('gm=0');
  return out.join('&');
}

/* Returns true if anything was applied, so the caller knows to rebuild. */
function applyStateFromURL(){
  const raw = (location.hash || '').replace(/^#/, '') || (location.search || '').replace(/^\?/, '');
  if (!raw) return false;
  let any = false;
  for (const pair of raw.split('&')){
    const i = pair.indexOf('=');
    if (i < 0) continue;
    const key = decodeURIComponent(pair.slice(0, i));
    const val = decodeURIComponent(pair.slice(i + 1));
    const num = parseFloat(val);
    const pk = URLKEY_INV[key];
    if (pk && Number.isFinite(num)){
      const sp = SPEC[pk];
      P[pk] = Math.min(sp.max, Math.max(sp.min, num));   // clamp: links can be hand-edited
      any = true;
    } else if (key === 'md' && MODEL_NAME[num]){ OPT.model = MODEL_NAME[num]; any = true; }
    else if (key === 'ap'){ OPT.autoPace = num !== 0; any = true; }
    else if (key === 'fd' && num >= 0 && num <= 6){ VIEW.field = Math.round(num); any = true; }
    else if (key === 'gn' && Number.isFinite(num) && num > 0){
      VIEW.gain = Math.min(32, Math.max(0.06, num)); any = true;
    }
    else if (key === 'gm'){ VIEW.showGeom = num !== 0; any = true; }
  }
  return any;
}

function pushStateToDOM(){
  syncSliders();
  if (UI.fieldSel) UI.fieldSel.value = String(VIEW.field);
  if (UI.geomChk)  UI.geomChk.checked = VIEW.showGeom;
  if (UI.gainIn){
    UI.gainIn.value = Math.log10(VIEW.gain);
    UI.gainOut.textContent = VIEW.gain.toFixed(VIEW.gain < 1 ? 2 : 1) + '×';
  }
  const ms = document.getElementById('modelSel'); if (ms) ms.value = OPT.model;
  const ac = document.getElementById('autoPace'); if (ac) ac.checked = OPT.autoPace;
}

let urlTimer = 0, selfNav = false;

/* Dragging a slider replaces the current entry (no history spam); a discrete action --
   a preset, a model change, resetting to defaults -- pushes one, so it can be undone. */
function writeURL(push){
  const q = encodeState();
  const url = q ? '#' + q : location.pathname + location.search;
  selfNav = true;
  try { push ? history.pushState(null, '', url) : history.replaceState(null, '', url); }
  catch (e) { location.hash = q; }          // file:// rejects pushState in some browsers
  setTimeout(() => { selfNav = false; }, 0);
  const el = document.getElementById('urlLen');
  if (el) el.textContent = (location.href || '').length + ' chars';
}

function scheduleURLSync(push){
  clearTimeout(urlTimer);
  if (push){ writeURL(true); return; }
  urlTimer = setTimeout(() => writeURL(false), 250);
}

/* Back and forward must actually restore the configuration, and restart the shot --
   otherwise you are looking at one geometry's flow inside another geometry's barrel. */
function onHistoryNav(){
  clearTimeout(urlTimer);
  Object.assign(P, DEFAULTS);               // clear first: the target URL may omit keys
  OPT.model = 'auto'; OPT.autoPace = true;
  VIEW.field = 0; VIEW.gain = 1; VIEW.showGeom = true;
  applyStateFromURL();
  pushStateToDOM();
  pendingRebuild = false;
  buildGrid();                              // rebuilds and resets the simulation
  S.running = true; DOM.pause.textContent = 'Pause';
  const el = document.getElementById('urlLen');
  if (el) el.textContent = (location.href || '').length + ' chars';
  updateMetrics();
}
window.addEventListener('popstate', onHistoryNav);
window.addEventListener('hashchange', () => { if (!selfNav) onHistoryNav(); });

/* ---- buttons & keys ---- */
document.getElementById('fire').addEventListener('click', () => {
  if (pendingRebuild){ buildGrid(); pendingRebuild = false; } else resetSim();
  S.running = true; S.spfAuto = 8; DOM.pause.textContent = 'Pause';
});
document.getElementById('reset').addEventListener('click', () => { buildGrid(); pendingRebuild = false; });
DOM.pause.addEventListener('click', e => {
  if (S.diverged) return;
  S.running = !S.running; e.target.textContent = S.running ? 'Pause' : 'Run';
});
document.getElementById('share').addEventListener('click', async e => {
  clearTimeout(urlTimer);
  writeURL(false);
  const url = location.href;
  const done = ok => {
    // the hash is already written, so if the clipboard is unavailable (no secure context,
    // e.g. opened over file://) the link is still sitting in the address bar
    e.target.textContent = ok ? 'Link copied ✓' : 'It\u2019s in the address bar';
    setTimeout(() => e.target.textContent = 'Copy shareable link', 2200);
  };
  try { await navigator.clipboard.writeText(url); done(true); }
  catch (err) {
    // clipboard API needs a secure context; file:// has none, so fall back to a selection
    const ta = document.createElement('textarea');
    ta.value = url; document.body.appendChild(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e2) {}
    document.body.removeChild(ta); done(ok);
  }
});

document.getElementById('defaults').addEventListener('click', () => {
  Object.assign(P, DEFAULTS);
  OPT.model = 'auto'; OPT.autoPace = true;
  VIEW.field = 0; VIEW.gain = 1; VIEW.showGeom = true;
  pushStateToDOM(); buildGrid(); scheduleURLSync(true); updateMetrics();
});

window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.key === 'Enter'){ document.getElementById('fire').click(); e.preventDefault(); }
  if (e.key === ' ')    { document.getElementById('pause').click(); e.preventDefault(); }
});

/* ========================== main loop ========================== */
const hud = document.getElementById('hud');
let lastWall = performance.now(), lastUi = 0, fps = 60;

function frame(){
  if (pendingRebuild && !S.running){ buildGrid(); pendingRebuild = false; }

  if (S.running && !S.diverged && !EXPORTING){
    if (pendingRebuild){ buildGrid(); pendingRebuild = false; }
    let simmed = 0;
    const n = OPT.autoPace ? Math.max(1, Math.round(S.spfAuto)) : P.spf;
    if (usingComp()){
      simmed = compSteps(n);
    } else if (WG.ok){
      simmed = wgpuSteps(n);
    } else {
      for (let i = 0; i < n; i++){ const dt = chooseDt(); step(dt); simmed += dt; }
    }
    S.frameDt = simmed;
  }
  if (!WG.ok && readerPoll(S.rdMax)){
    const vr = S.rdMax.data[0], vz = S.rdMax.data[1];
    if (!Number.isFinite(vr) || !Number.isFinite(vz) || Math.max(vr, vz) > 5000)
      flagDivergence(Math.max(vr, vz));
    else {
      S.vrmax = Math.max(vr, 0.05);
      S.vzmax = Math.max(vz, 0.05);
      S.vmax  = Math.max(vr, vz, 0.05);
    }
  }
  if (!WG.ok && readerPoll(S.rdProbe)) consumeProbe(S.rdProbe.data, S.rdProbe.tag);
  if (!WG.ok && S.running){
    readerIssue(S.rdMax, reduceRender().fbo, 0, 0, 1, 1);
    S.rdProbe.tag = S.t;
    readerIssue(S.rdProbe, S.vel.read.fbo, probeIz().iz, 0, 1, S.Nr + 1);
  }
  if (!EXPORTING) render();

  const now = performance.now();
  const wall = Math.min(Math.max(now - lastWall, 1), 500);
  lastWall = now;
  S.wallSmooth += (wall - S.wallSmooth) * 0.15;
  fps += ((1000/wall) - fps) * 0.1;
  S.simRate = S.frameDt * 1000 / Math.max(S.wallSmooth, 1);

  // Steer steps-per-frame towards the frame budget. Nothing else adapts to the wide range
  // of timestep sizes the geometry produces, so without this a small orifice is a slideshow.
  if (OPT.autoPace && S.running && !S.diverged){
    if (S.wallSmooth > P.budget * 1.15)      S.spfAuto = Math.max(1, S.spfAuto * 0.85);
    else if (S.wallSmooth < P.budget * 0.85) S.spfAuto = Math.min(2000, S.spfAuto * 1.10);
  }

  // The plot and the metrics panel are DOM work; at 60 Hz they cost more than the solver.
  if (now - lastUi > 90){
    lastUi = now;
    drawPlot();
    drawLegend(S.colourScale || 1);
    updateMetrics();
    DOM.scalebar.textContent =
      `domain ${S.Lz.toFixed(0)} × ${(2*S.Rmax).toFixed(0)} mm   grid ${S.Nz} × ${S.Nr}   ` +
      `cell ${S.dz.toFixed(2)} × ${S.dr.toFixed(2)} mm`;
  }

  const steps = OPT.autoPace ? Math.max(1, Math.round(S.spfAuto)) : P.spf;
  hud.textContent =
    `t = ${S.t.toFixed(1)} ms   dt = ${(S.dt*1000).toFixed(1)} µs   ` +
    `max |u| = ${S.vmax.toFixed(1)} m/s\n` +
    `piston  x = ${S.pistonX.toFixed(1)} mm   v = ${S.pistonV.toFixed(2)} m/s` +
    (S.firing ? '   ▶ pushing' : '   ■ coasting') + `\n` +
    `${fps.toFixed(0)} fps   ${steps} steps/frame   ` +
    `${S.simRate.toFixed(1)} ms of flight per second\n` +
    (usingComp()
      ? `compressible Navier-Stokes (HLLC/MUSCL)   max Mach ${CP.machMax.toFixed(2)}   ` +
        `${(steps*7).toLocaleString()} dispatches/frame`
      : WG.ok
        ? `incompressible   ${(steps*(7 + P.iters)).toLocaleString()} dispatches/frame, 1 submit`
        : `incompressible, WebGL2   ${(steps*(P.iters+6)).toLocaleString()} passes @ ${S.passUs.toFixed(0)} µs`);

  requestAnimationFrame(frame);
}

function flagDivergence(v){
  S.diverged = true; S.running = false;
  DOM.pause.textContent = 'Run';
  const el = document.getElementById('diverged');
  el.style.display = 'block';
  el.innerHTML = `<b>The run diverged.</b> Peak velocity reached ` +
    (Number.isFinite(v) ? `${v.toFixed(0)} m/s` : 'a non-finite value') +
    `, which means the pressure solve stopped enforcing mass conservation. ` +
    `Raise <b>pressure iterations</b>, or lower the <b>CFL number</b>, then fire again.`;
}

(async function boot(){
  const usedGPU = await wgpuInit();
  if (usedGPU){
    document.getElementById('view').style.display = 'none';
    WG.canvas.style.display = 'block';
    await compInit();
  }
  if (!CP.ok) OPT.model = 'incompressible';
  applyStateFromURL();
  pushStateToDOM();
  updateExportDerived();
  buildGrid();
  scheduleURLSync();
  S.passUs = usedGPU ? 0 : measurePassCost();
  S.backend = usedGPU ? 'WebGPU compute' : 'WebGL2 fragment';
  updateMetrics();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
