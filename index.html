<script>
"use strict";
/* ========================== one solver step ========================== */
function step(dt){
  S.dt = dt;
  const k = pistonKinematics(S.t);
  S.pistonX = k.x; S.pistonV = k.v;
  S.firing = S.t < P.pushMs;

  // forces and proj enforce the solid boundaries themselves; on this hardware every
  // framebuffer bind costs far more than the shading, so merged passes are pure win.
  run(PROG.advectVel, S.vel.write, { uVel:S.vel.read.tex });                      S.vel.swap();
  run(PROG.vort,      S.vort.write,{ uVel:S.vel.read.tex });                      S.vort.swap();
  run(PROG.forces,    S.vel.write, { uVel:S.vel.read.tex, uVort:S.vort.read.tex });S.vel.swap();
  run(PROG.div,       S.div,       { uVel:S.vel.read.tex });
  jacobiSweeps(P.iters);
  run(PROG.proj,      S.vel.write, { uVel:S.vel.read.tex, uPres:S.pres.read.tex });S.vel.swap();
  run(PROG.dye,       S.dye.write, { uVel:S.vel.read.tex, uDye:S.dye.read.tex });  S.dye.swap();
  S.t += dt;
}

/* The Jacobi loop dominates the frame, and at these grid sizes it is bound by GL call
   overhead rather than fill rate — so hoist the uniform setup out and leave only the
   texture bind, FBO bind and draw inside. */
function jacobiSweeps(n){
  const p = PROG.jacobi;
  gl.useProgram(p);
  setCommon(p);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, S.div.tex);
  gl.uniform1i(loc(p,'uDivT'), 1);
  gl.uniform1i(loc(p,'uPres'), 0);
  gl.bindVertexArray(emptyVAO);
  gl.viewport(0, 0, S.Nz, S.Nr);
  gl.activeTexture(gl.TEXTURE0);
  for (let i = 0; i < n; i++){
    gl.bindTexture(gl.TEXTURE_2D, S.pres.read.tex);
    gl.bindFramebuffer(gl.FRAMEBUFFER, S.pres.write.fbo);
    gl.invalidateFramebuffer(gl.FRAMEBUFFER, [gl.COLOR_ATTACHMENT0]);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    S.pres.swap();
  }
}

/* The advective limit is directional: the fast axial jet is limited by dz, the much slower
   radial motion by dr. Using min(dz,dr) against a single scalar max|u| throws away most of
   the timestep a stretched grid earns. */
function chooseDt(){
  const k  = pistonKinematics(S.t);
  const ar = Math.pow(P.boreR / Math.max(P.exitR, 0.5), 2);
  const vz = Math.max(S.vzmax*1.2, Math.abs(k.v)*ar, 0.3);
  const vr = Math.max(S.vrmax*1.2, 0.3);
  return Math.min(0.5, P.cfl / (vz/S.dz + vr/S.dr));
}

/* ---- asynchronous GPU readback ----------------------------------------------
   A plain readPixels costs ~10 ms of pipeline stall per call, which swamped the
   0.15 ms solver step. Instead the result goes into a pixel-pack buffer and is
   collected a frame or two later via a fence. ---------------------------------- */
function makeReader(floats){
  return { buf: gl.createBuffer(), sync: null, pending: false, tag: 0, waits: 0,
           rect: null, fbo: null, data: new Float32Array(floats) };
}
function destroyReader(rd){
  if (!rd) return;
  if (rd.sync) gl.deleteSync(rd.sync);
  gl.deleteBuffer(rd.buf);
}
function readerIssue(rd, fbo, x, y, w, h){
  if (rd.pending) return;
  rd.fbo = fbo; rd.rect = [x, y, w, h]; rd.waits = 0;
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.bindBuffer(gl.PIXEL_PACK_BUFFER, rd.buf);
  gl.bufferData(gl.PIXEL_PACK_BUFFER, rd.data.byteLength, gl.STREAM_READ);
  gl.readPixels(x, y, w, h, gl.RGBA, gl.FLOAT, 0);
  gl.bindBuffer(gl.PIXEL_PACK_BUFFER, null);
  rd.sync = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
  rd.pending = true;
}
function readerFetch(rd){
  gl.bindBuffer(gl.PIXEL_PACK_BUFFER, rd.buf);
  gl.getBufferSubData(gl.PIXEL_PACK_BUFFER, 0, rd.data);
  gl.bindBuffer(gl.PIXEL_PACK_BUFFER, null);
  gl.deleteSync(rd.sync); rd.sync = null;
  rd.pending = false;
  return true;
}
function readerPoll(rd){
  if (!rd.pending) return false;
  // SYNC_FLUSH_COMMANDS_BIT is what actually pushes the fence towards being signalled;
  // WebGL2 only permits a zero timeout here.
  const st = gl.clientWaitSync(rd.sync, gl.SYNC_FLUSH_COMMANDS_BIT, 0);
  if (st === gl.ALREADY_SIGNALED || st === gl.CONDITION_SATISFIED) return readerFetch(rd);
  // Safety net: if fences are not making progress on this driver, take the stall rather
  // than let the readouts freeze.
  if (++rd.waits > 30){ gl.finish(); return readerFetch(rd); }
  return false;
}

/* max |u| over the whole field, by log2 reduction on the GPU */
function reduceRender(){
  let src = S.vel.read.tex, sw = S.Nz+1, sh = S.Nr+1, first = 1;
  for (const t of S.reduce){
    run(PROG.reduce, t, { uSrc:src }, p => {
      gl.uniform2i(loc(p,'uSrcSize'), sw, sh);
      gl.uniform1i(loc(p,'uFirst'), first);
    });
    src = t.tex; sw = t.w; sh = t.h; first = 0;
  }
  return S.reduce[S.reduce.length - 1];
}

function probeIz(){
  const zP = Math.min(S.Lz - S.dz, S.Z1 + P.plateT + P.probe);
  return { zP, iz: Math.max(0, Math.min(S.Nz, Math.round(zP / S.dz))) };
}

/* ---- turn a probe-plane velocity profile into the headline numbers ---- */
function consumeProbe(buf, t){
  const axis = buf[1];
  let mx = 0, Q = 0, mom = 0;
  for (let ir = 0; ir < S.Nr; ir++){
    const uz = buf[ir*4 + 1];
    if (!Number.isFinite(uz)) continue;
    if (Math.abs(uz) > Math.abs(mx)) mx = uz;
    const rc = (ir + 0.5) * S.dr, dA = 2*Math.PI*rc*S.dr;
    if (uz > 0){ Q += uz*dA; mom += uz*uz*dA; }
  }
  S.meas = { axis, mx, Q, mom };
  if (mx > S.peak){ S.peak = mx; S.peakT = t; }
  if (S.arrival < 0 && mx > 0.25) S.arrival = t;
  S.series.push([t, axis, mx]);
  if (S.series.length > 4000) S.series.splice(0, 2000);
}

/* ========================== rendering ========================== */
function resizeCanvas(){
  const wrap = document.getElementById('viewWrap');
  const aspect = S.Lz / (2*S.Rmax);
  let w = wrap.clientWidth - 2, h = wrap.clientHeight - 2;
  if (w / h > aspect) w = h * aspect; else h = w / aspect;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cv = WG.ok ? WG.canvas : canvas;
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
  cv.width  = Math.max(2, Math.round(w * dpr));
  cv.height = Math.max(2, Math.round(h * dpr));
}
window.addEventListener('resize', () => { if (S.Nz) resizeCanvas(); });

function render(){
  if (WG.ok){ wgpuRender(); return; }
  const g = VIEW.gain;
  let base;
  switch (VIEW.field){
    case 1: base = Math.max(S.vmax * 0.75, 1e-3); break;
    case 2: base = Math.max(S.vmax / Math.min(S.dz, S.dr) * 0.12, 1e-3); break;
    case 3: base = Math.max(S.vmax * S.vmax * 0.4, 1e-3); break;
    case 4: base = Math.max(S.vmax * 0.75, 1e-3); break;
    default: base = 1;
  }
  run(PROG.show, null,
      { uVel:S.vel.read.tex, uDye:S.dye.read.tex, uVort:S.vort.read.tex, uPres:S.pres.read.tex },
      p => {
        gl.uniform2f(loc(p,'uViewport'), canvas.width, canvas.height);
        gl.uniform1i(loc(p,'uField'), VIEW.field);
        gl.uniform1f(loc(p,'uScale'), base / g);
        gl.uniform1i(loc(p,'uShowGeom'), VIEW.showGeom ? 1 : 0);
        gl.uniform1f(loc(p,'uProbeZ'), Math.min(S.Lz - S.dz, S.Z1 + P.plateT + P.probe));
      });
}

/* ========================== derived design numbers ========================== */
const MMS_TO_MS = 1;                       // 1 mm/ms == 1 m/s
function derived(){
  const Rb = P.boreR, re = Math.min(P.exitR, Rb - 0.25);
  const Sd = Math.min(P.stroke, maxStroke());
  const Vswept = Math.PI*Rb*Rb*Sd;                       // mm³
  const Aex = Math.PI*re*re;
  const Lslug = Vswept / Aex;
  const LD = Lslug / (2*re);
  const reOpt = Math.cbrt(Rb*Rb*Sd / 8);                 // L/D = 4
  const vPiston = Math.PI*Sd / (2*P.pushMs);             // mm/ms = m/s
  const vExit = vPiston * (Rb*Rb)/(re*re);
  const mach = vExit / 343;
  const Re = vExit * 2*re / Math.max(P.visc, 1e-9);
  const gapFrac = P.pistonClr > 0 ? 1 - Math.pow((Rb - P.pistonClr)/Rb, 2) : 0;
  return { Rb, re, Sd, Vswept, Lslug, LD, reOpt, vPiston, vExit, mach, Re, gapFrac };
}

const fmt = (x, d = 1) => (Number.isFinite(x) ? x.toFixed(d) : '—');
function updateMetrics(){
  const D = derived(), m = S.meas || { axis:0, mx:0, Q:0 };
  const flags = [];
  if (D.LD > 8)  flags.push(['bad', `Slug L/D = ${fmt(D.LD)}. A vortex ring pinches off at L/D ≈ 4 and everything after that is a trailing jet that stalls within a few diameters. This is the main reason a small orifice does not throw air further.`]);
  else if (D.LD < 1.5) flags.push(['warn', `Slug L/D = ${fmt(D.LD,2)} — too short to roll up a ring. Longer stroke or smaller exit.`]);
  else flags.push(['good', `Slug L/D = ${fmt(D.LD,2)} — in the ring-formation window (≈ 4 is optimum).`]);
  if (D.mach > 0.3) flags.push(['bad', `Exit speed ${fmt(D.vExit)} m/s = Mach ${fmt(D.mach,2)}. The incompressible solver stops being valid here, and a real 3D-printed nozzle would choke and dump the energy as heat and noise.`]);
  else if (D.mach > 0.15) flags.push(['warn', `Exit speed ${fmt(D.vExit)} m/s — compressibility starts to matter above ~100 m/s.`]);
  if (D.gapFrac > 0.03) flags.push(['warn', `Piston clearance leaks ${fmt(D.gapFrac*100)}% of the bore area. Blow-by past the piston bypasses the muzzle entirely.`]);
  if (P.stroke > maxStroke() + 0.5) flags.push(['warn', `Stroke clipped to ${fmt(D.Sd)} mm — the piston would hit the orifice plate.`]);
  flags.push(['warn', `The velocities above the line are analytic and solid. The measured ` +
    `numbers below it are not grid-converged: re-running at 64, 112 and 160 radial cells moved ` +
    `the peak by a factor of two or more, without settling. Read them as ranking designs, ` +
    `never as absolute figures — the ring-versus-no-ring structure is the trustworthy output.`]);

  const rows = (title, list) => `<h4>${title}</h4>` + list.map(
    ([k,v]) => `<div class="row"><span class="k">${k}</span><span class="v">${v}</span></div>`).join('');

  DOM.metrics.innerHTML =
    rows('Design', [
      ['swept volume',    fmt(D.Vswept/1000,1) + ' mL'],
      ['exit / bore area',fmt((D.Rb*D.Rb)/(D.re*D.re),1) + ' : 1'],
      ['slug length',     fmt(D.Lslug,0) + ' mm'],
      ['slug L/D',        fmt(D.LD,2)],
      ['exit R for L/D=4',fmt(D.reOpt,1) + ' mm'],
      ['peak piston',     fmt(D.vPiston,2) + ' m/s'],
      ['mean exit speed', fmt(D.vExit,1) + ' m/s (M ' + fmt(D.mach,2) + ')'],
      ['exit Reynolds',   D.Re > 1e4 ? (D.Re/1000).toFixed(0)+'k' : fmt(D.Re,0)],
    ]) + '<hr>' +
    rows(`At target (${fmt(P.probe,0)} mm)`, [
      ['on-axis u_z',   fmt(m.axis,2) + ' m/s'],
      ['peak u_z now',  fmt(m.mx,2) + ' m/s'],
      ['peak u_z ever', fmt(S.peak,2) + ' m/s' + (S.peak > 0.05 ? ` @ ${fmt(S.peakT,0)} ms` : '')],
      ['arrival',       S.arrival >= 0 ? fmt(S.arrival,0) + ' ms' : 'not yet'],
      ['volume flux',   fmt(m.Q,0) + ' mL/s'],
    ]) +
    flags.map(([c,t]) => `<div class="flag ${c}">${t}</div>`).join('');
}

/* ========================== time-series plot ========================== */
const plot = document.getElementById('plot'), pctx = plot.getContext('2d');
function drawPlot(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = plot.clientWidth, h = plot.clientHeight;
  if (plot.width !== Math.round(w*dpr)){ plot.width = Math.round(w*dpr); plot.height = Math.round(h*dpr); }
  pctx.setTransform(dpr,0,0,dpr,0,0);
  pctx.clearRect(0,0,w,h);
  DOM.plotTitle.textContent =
    `axial velocity at the target plane, ${fmt(P.probe,0)} mm downrange   —   ` +
    `on-axis (cyan) and plane maximum (orange)`;

  const ser = S.series;
  if (ser.length < 2) return;
  const t1 = Math.max(ser[ser.length-1][0], 1);
  let vmaxP = 0.5;
  for (const s of ser) vmaxP = Math.max(vmaxP, Math.abs(s[1]), Math.abs(s[2]));
  const X = t => 34 + (w - 44) * (t / t1);
  const Y = v => h - 16 - (h - 26) * (v / (vmaxP*1.08));

  pctx.strokeStyle = '#2b3440'; pctx.lineWidth = 1;
  pctx.beginPath(); pctx.moveTo(X(0), Y(0)); pctx.lineTo(X(t1), Y(0)); pctx.stroke();
  pctx.fillStyle = '#8b97a6'; pctx.font = '10px ui-monospace, monospace';
  pctx.fillText(fmt(vmaxP,1)+' m/s', 2, 12);
  pctx.fillText('0', 22, Y(0)-2);
  pctx.fillText(fmt(t1,0)+' ms', w-44, h-3);

  for (const [idx, colr] of [[1,'#5ec6ff'], [2,'#ffb454']]){
    pctx.strokeStyle = colr; pctx.lineWidth = 1.4; pctx.beginPath();
    ser.forEach((s,i) => { const x = X(s[0]), y = Y(s[idx]); i ? pctx.lineTo(x,y) : pctx.moveTo(x,y); });
    pctx.stroke();
  }
}
</script>
<script>
"use strict";
/* ==========================================================================
   WebGPU compute backend.
   The WebGL2 path runs every kernel as a fragment shader, so each one is a
   draw into a framebuffer and pays ~65 us of render-pass setup against ~4 us
   of actual shading. Compute dispatches pay none of that, and workgroup
   shared memory lets one dispatch carry several Jacobi iterations instead of
   one -- which is where the pressure solve's cost actually goes.
   ========================================================================== */

const WG = {
  ok:false, dev:null, ctx:null, fmt:null, canvas:null,
};

const WGSL_PARAMS = `
struct Params {
  cells : vec2<i32>,          // Nz, Nr
  faces : vec2<i32>,          // Nz+1, Nr+1
  d     : vec2<f32>,          // dz, dr
  dtlz  : vec2<f32>,          // dt, Lz
  geoA  : vec4<f32>,          // rmax, z0, z1, boreR
  geoB  : vec4<f32>,          // wallT, exitR, plateT, taper
  pist  : vec4<f32>,          // pz0, pz1, pr, pv
  flu   : vec4<f32>,          // visc, vortEps, dyeDiss, smag
  misc  : vec4<f32>,          // seed, probeIz, _, _
};
@group(0) @binding(0) var<uniform> P : Params;
`;

/* The compute kernels need nine storage buffers; the display fragment shader needs four,
   read-only. Splitting the declarations keeps each stage under its per-stage limit, and
   a fragment shader may not bind a read_write storage buffer at all. */
const WGSL_DECLS_C = `
@group(1) @binding(0) var<storage, read>       velS : array<vec2<f32>>;
@group(1) @binding(1) var<storage, read_write> velD : array<vec2<f32>>;
@group(1) @binding(2) var<storage, read>       preS : array<f32>;
@group(1) @binding(3) var<storage, read_write> preD : array<f32>;
@group(1) @binding(4) var<storage, read_write> divB : array<f32>;
@group(1) @binding(5) var<storage, read_write> vorB : array<f32>;
@group(1) @binding(6) var<storage, read>       dyeS : array<f32>;
@group(1) @binding(7) var<storage, read_write> dyeD : array<f32>;
@group(1) @binding(8) var<storage, read_write> probeB : array<f32>;
@group(1) @binding(9) var<storage, read_write> coefB : array<vec4<f32>>;
`;
const WGSL_DECLS_S = `
@group(1) @binding(0) var<storage, read> velS : array<vec2<f32>>;
@group(1) @binding(1) var<storage, read> preS : array<f32>;
@group(1) @binding(2) var<storage, read> vorB : array<f32>;
@group(1) @binding(3) var<storage, read> dyeS : array<f32>;
`;
const WGSL_HELPERS = `
const FLUID : i32 = 0;
const WALL  : i32 = 1;
const PISTON: i32 = 2;

fn solidAt(p : vec2<f32>) -> i32 {
  let z = p.x; let r = p.y;
  if (z >= P.pist.x && z <= P.pist.y && r <= P.pist.z) { return PISTON; }
  let outR = P.geoA.w + P.geoB.x;
  if (z >= P.geoA.y && z <= P.geoA.z + P.geoB.z && r <= outR) {
    var rin : f32;
    let taper = P.geoB.w; let z1 = P.geoA.z;
    if (z <= z1 - taper) { rin = P.geoA.w; }
    else if (z <= z1) {
      if (taper > 0.0) { rin = mix(P.geoA.w, P.geoB.y, (z - (z1 - taper)) / taper); }
      else { rin = P.geoA.w; }
    } else { rin = P.geoB.y; }
    if (r >= rin) { return WALL; }
  }
  return FLUID;
}
fn solidCell(iz : i32, ir : i32) -> i32 {
  return solidAt(vec2<f32>((f32(iz) + 0.5) * P.d.x, (f32(ir) + 0.5) * P.d.y));
}
fn cellCentre(iz : i32, ir : i32) -> vec2<f32> {
  return vec2<f32>((f32(iz) + 0.5) * P.d.x, (f32(ir) + 0.5) * P.d.y);
}
fn iF(iz : i32, ir : i32) -> u32 {            // clamped index into a face array
  let z = clamp(iz, 0, P.faces.x - 1);
  let r = clamp(ir, 0, P.faces.y - 1);
  return u32(r * P.faces.x + z);
}
fn iC(iz : i32, ir : i32) -> u32 {            // clamped index into a cell array
  let z = clamp(iz, 0, P.cells.x - 1);
  let r = clamp(ir, 0, P.cells.y - 1);
  return u32(r * P.cells.x + z);
}
fn fV(iz : i32, ir : i32) -> vec2<f32> { return velS[iF(iz, ir)]; }
fn fW(iz : i32, ir : i32) -> f32       { return vorB[iF(iz, ir)]; }
fn fD(iz : i32, ir : i32) -> f32       { return dyeS[iC(iz, ir)]; }
fn fP(iz : i32, ir : i32) -> f32       { return preS[iC(iz, ir)]; }

fn sampleUr(p : vec2<f32>) -> f32 {
  let f  = vec2<f32>(p.x / P.d.x - 0.5, p.y / P.d.y);
  let fl = floor(f); let i = vec2<i32>(fl); let s = f - fl;
  return mix(mix(fV(i.x, i.y).x, fV(i.x + 1, i.y).x, s.x),
             mix(fV(i.x, i.y + 1).x, fV(i.x + 1, i.y + 1).x, s.x), s.y);
}
fn sampleUz(p : vec2<f32>) -> f32 {
  let f  = vec2<f32>(p.x / P.d.x, p.y / P.d.y - 0.5);
  let fl = floor(f); let i = vec2<i32>(fl); let s = f - fl;
  return mix(mix(fV(i.x, i.y).y, fV(i.x + 1, i.y).y, s.x),
             mix(fV(i.x, i.y + 1).y, fV(i.x + 1, i.y + 1).y, s.x), s.y);
}
fn sampleDye(p : vec2<f32>) -> f32 {
  let f  = vec2<f32>(p.x / P.d.x - 0.5, p.y / P.d.y - 0.5);
  let fl = floor(f); let i = vec2<i32>(fl); let s = f - fl;
  return mix(mix(fD(i.x, i.y), fD(i.x + 1, i.y), s.x),
             mix(fD(i.x, i.y + 1), fD(i.x + 1, i.y + 1), s.x), s.y);
}
fn velAt(p : vec2<f32>) -> vec2<f32> { return vec2<f32>(sampleUz(p), sampleUr(p)); }
fn backtrace(p : vec2<f32>) -> vec2<f32> {
  let dt = P.dtlz.x;
  let pm = p - 0.5 * dt * velAt(p);
  let pb = p - dt * velAt(pm);
  return clamp(pb, vec2<f32>(0.0), vec2<f32>(P.dtlz.y, P.geoA.x));
}
fn applySolids(iz : i32, ir : i32, ur : ptr<function, f32>, uz : ptr<function, f32>) {
  if (ir == 0) { *ur = 0.0; }
  else if (solidCell(iz, ir - 1) != FLUID || solidCell(iz, ir) != FLUID) { *ur = 0.0; }
  var a = FLUID; var b = FLUID;
  if (iz > 0)            { a = solidCell(iz - 1, ir); }
  if (iz < P.cells.x)    { b = solidCell(iz, ir); }
  if (a == WALL || b == WALL) { *uz = 0.0; }
  else if (a == PISTON || b == PISTON) { *uz = P.pist.w; }
}
`;

const WGSL_KERNELS = WGSL_PARAMS + WGSL_DECLS_C + WGSL_HELPERS + `
@compute @workgroup_size(8, 8)
fn advectVel(@builtin(global_invocation_id) g : vec3<u32>) {
  let iz = i32(g.x); let ir = i32(g.y);
  if (iz >= P.faces.x || ir >= P.faces.y) { return; }
  var nur = 0.0; var nuz = 0.0;
  if (ir > 0 && iz < P.cells.x) {
    nur = sampleUr(backtrace(vec2<f32>((f32(iz) + 0.5) * P.d.x, f32(ir) * P.d.y)));
  }
  if (ir < P.cells.y) {
    nuz = sampleUz(backtrace(vec2<f32>(f32(iz) * P.d.x, (f32(ir) + 0.5) * P.d.y)));
  }
  velD[iF(iz, ir)] = vec2<f32>(nur, nuz);
}

@compute @workgroup_size(8, 8)
fn vorticity(@builtin(global_invocation_id) g : vec3<u32>) {
  let iz = i32(g.x); let ir = i32(g.y);
  if (iz >= P.faces.x || ir >= P.faces.y) { return; }
  let dur_dz = (fV(iz, ir).x - fV(iz - 1, ir).x) / P.d.x;
  let duz_dr = (fV(iz, ir).y - fV(iz, ir - 1).y) / P.d.y;
  vorB[iF(iz, ir)] = dur_dz - duz_dr;
}

fn eddyVisc(iz : i32, ir : i32) -> f32 {
  if (P.flu.w <= 0.0) { return 0.0; }
  let dz = P.d.x; let dr = P.d.y;
  let rc = (f32(ir) + 0.5) * dr;
  let durdr = (fV(iz, ir + 1).x - fV(iz, ir).x) / dr;
  let duzdz = (fV(iz + 1, ir).y - fV(iz, ir).y) / dz;
  let urc   = 0.5 * (fV(iz, ir).x + fV(iz, ir + 1).x);
  let stt   = urc / max(rc, 1e-6);
  let durdz = 0.25 * ((fV(iz + 1, ir).x - fV(iz - 1, ir).x)
                    + (fV(iz + 1, ir + 1).x - fV(iz - 1, ir + 1).x)) / dz;
  let duzdr = 0.25 * ((fV(iz, ir + 1).y - fV(iz, ir - 1).y)
                    + (fV(iz + 1, ir + 1).y - fV(iz + 1, ir - 1).y)) / dr;
  let srz = 0.5 * (durdz + duzdr);
  let s2  = 2.0 * (durdr * durdr + duzdz * duzdz + stt * stt) + 4.0 * srz * srz;
  let dd  = sqrt(dr * dz);
  return P.flu.w * P.flu.w * dd * dd * sqrt(max(s2, 0.0));
}

@compute @workgroup_size(8, 8)
fn forces(@builtin(global_invocation_id) g : vec3<u32>) {
  let iz = i32(g.x); let ir = i32(g.y);
  if (iz >= P.faces.x || ir >= P.faces.y) { return; }
  let v = fV(iz, ir);
  var ur = v.x; var uz = v.y;
  let dz = P.d.x; let dr = P.d.y;
  let dr2 = dr * dr; let dz2 = dz * dz;
  let dt = P.dtlz.x;
  var nu = P.flu.x + eddyVisc(clamp(iz, 0, P.cells.x - 1), clamp(ir, 0, P.cells.y - 1));
  nu = min(nu, 0.25 * min(dr2, dz2) / max(dt, 1e-9));

  if (ir > 0) {
    let rf = f32(ir) * dr;
    let rp = rf + 0.5 * dr; let rm = rf - 0.5 * dr;
    let lap = (rp * (fV(iz, ir + 1).x - ur) - rm * (ur - fV(iz, ir - 1).x)) / (rf * dr2)
            - ur / (rf * rf)
            + (fV(iz + 1, ir).x - 2.0 * ur + fV(iz - 1, ir).x) / dz2;
    ur = ur + dt * nu * lap;
  } else { ur = 0.0; }
  {
    let rc = (f32(ir) + 0.5) * dr;
    let rp = f32(ir + 1) * dr; let rm = f32(ir) * dr;
    let lap = (rp * (fV(iz, ir + 1).y - uz) - rm * (uz - fV(iz, ir - 1).y)) / (rc * dr2)
            + (fV(iz + 1, ir).y - 2.0 * uz + fV(iz - 1, ir).y) / dz2;
    uz = uz + dt * nu * lap;
  }
  if (P.flu.y > 0.0) {
    let h = 0.5 * (dr + dz);
    let eps = P.flu.y;
    if (ir > 0) {
      let wf = 0.5 * (fW(iz, ir) + fW(iz + 1, ir));
      let gz = (abs(fW(iz + 1, ir)) - abs(fW(iz, ir))) / dz;
      let gr = 0.25 * ((abs(fW(iz, ir + 1)) + abs(fW(iz + 1, ir + 1)))
                     - (abs(fW(iz, ir - 1)) + abs(fW(iz + 1, ir - 1)))) / dr;
      let n = vec2<f32>(gz, gr); let L = length(n);
      if (L > 1e-9) { ur = ur + dt * eps * h * (-(n.x / L) * wf); }
    }
    {
      let wf = 0.5 * (fW(iz, ir) + fW(iz, ir + 1));
      let gr = (abs(fW(iz, ir + 1)) - abs(fW(iz, ir))) / dr;
      let gz = 0.25 * ((abs(fW(iz + 1, ir)) + abs(fW(iz + 1, ir + 1)))
                     - (abs(fW(iz - 1, ir)) + abs(fW(iz - 1, ir + 1)))) / dz;
      let n = vec2<f32>(gz, gr); let L = length(n);
      if (L > 1e-9) { uz = uz + dt * eps * h * ((n.y / L) * wf); }
    }
  }
  applySolids(iz, ir, &ur, &uz);
  velD[iF(iz, ir)] = vec2<f32>(ur, uz);
}

@compute @workgroup_size(8, 8)
fn divergence(@builtin(global_invocation_id) g : vec3<u32>) {
  let iz = i32(g.x); let ir = i32(g.y);
  if (iz >= P.cells.x || ir >= P.cells.y) { return; }
  if (solidCell(iz, ir) != FLUID) { divB[iC(iz, ir)] = 0.0; return; }
  let dr = P.d.y; let dz = P.d.x;
  let rc = (f32(ir) + 0.5) * dr;
  let rm = f32(ir) * dr; let rp = f32(ir + 1) * dr;
  let d = (rp * fV(iz, ir + 1).x - rm * fV(iz, ir).x) / (rc * dr)
        + (fV(iz + 1, ir).y - fV(iz, ir).y) / dz;
  divB[iC(iz, ir)] = d;
}

@compute @workgroup_size(8, 8)
fn project(@builtin(global_invocation_id) g : vec3<u32>) {
  let iz = i32(g.x); let ir = i32(g.y);
  if (iz >= P.faces.x || ir >= P.faces.y) { return; }
  let v = fV(iz, ir);
  var ur = v.x; var uz = v.y;
  let dt = P.dtlz.x;
  if (ir > 0 && ir <= P.cells.y && iz < P.cells.x) {
    let pIn = fP(iz, ir - 1);
    var pOut = 0.0;
    if (ir < P.cells.y) { pOut = fP(iz, ir); }
    ur = ur - dt * (pOut - pIn) / P.d.y;
  } else { ur = 0.0; }
  if (ir < P.cells.y) {
    var pL = 0.0; var pR = 0.0;
    if (iz > 0)         { pL = fP(iz - 1, ir); }
    if (iz < P.cells.x) { pR = fP(iz, ir); }
    uz = uz - dt * (pR - pL) / P.d.x;
  }
  applySolids(iz, ir, &ur, &uz);
  velD[iF(iz, ir)] = vec2<f32>(ur, uz);
}

@compute @workgroup_size(8, 8)
fn advectDye(@builtin(global_invocation_id) g : vec3<u32>) {
  let iz = i32(g.x); let ir = i32(g.y);
  if (iz >= P.cells.x || ir >= P.cells.y) { return; }
  let p = cellCentre(iz, ir);
  if (solidAt(p) != FLUID) { dyeD[iC(iz, ir)] = 0.0; return; }
  var d = sampleDye(backtrace(p)) * exp(-P.flu.z * P.dtlz.x);
  if (i32(P.misc.x) == 1 && p.y <= P.pist.z && p.x >= P.pist.y && p.x <= P.pist.y + 3.0) {
    d = 1.0;
  }
  dyeD[iC(iz, ir)] = clamp(d, 0.0, 1.0);
}

@compute @workgroup_size(8, 8)
fn dyeInit(@builtin(global_invocation_id) g : vec3<u32>) {
  let iz = i32(g.x); let ir = i32(g.y);
  if (iz >= P.cells.x || ir >= P.cells.y) { return; }
  let p = cellCentre(iz, ir);
  let inBarrel = solidAt(p) == FLUID && p.x > P.geoA.y && p.x < P.geoA.z + P.geoB.z
                 && p.y < P.geoA.w;
  var v = 0.0;
  if (inBarrel) { v = 1.0; }
  dyeD[iC(iz, ir)] = v;
}

@compute @workgroup_size(8, 8)
fn clearAll(@builtin(global_invocation_id) g : vec3<u32>) {
  let iz = i32(g.x); let ir = i32(g.y);
  if (iz < P.faces.x && ir < P.faces.y) {
    velD[iF(iz, ir)] = vec2<f32>(0.0);
    vorB[iF(iz, ir)] = 0.0;
  }
  if (iz < P.cells.x && ir < P.cells.y) {
    preD[iC(iz, ir)] = 0.0;
    divB[iC(iz, ir)] = 0.0;
  }
}

/* Everything the Jacobi sweep needs about geometry and boundaries, folded once per step
   into four coefficients and a scaled right-hand side. The inner loop then costs one dot
   product instead of five solidAt evaluations, which is where the time actually went.
   divB is rewritten in place: it arrives as divergence and leaves as rhs/den. */
@compute @workgroup_size(8, 8)
fn prepare(@builtin(global_invocation_id) g : vec3<u32>) {
  let iz = i32(g.x); let ir = i32(g.y);
  if (iz >= P.cells.x || ir >= P.cells.y) { return; }
  let k = iC(iz, ir);
  if (solidCell(iz, ir) != FLUID) {
    coefB[k] = vec4<f32>(0.0); divB[k] = 0.0; return;
  }
  let nz = P.cells.x; let nr = P.cells.y;
  let dz = P.d.x; let dr = P.d.y;
  let rc = (f32(ir) + 0.5) * dr;
  let aM = (f32(ir) * dr) / (rc * dr * dr);
  let aP = (f32(ir + 1) * dr) / (rc * dr * dr);
  let b  = 1.0 / (dz * dz);
  var cW = 0.0; var cE = 0.0; var cS = 0.0; var cN = 0.0; var den = 0.0;
  if (ir > 0) {
    if (solidCell(iz, ir - 1) == FLUID) { cS = aM; den = den + aM; }
  }
  if (ir < nr - 1) {
    if (solidCell(iz, ir + 1) == FLUID) { cN = aP; den = den + aP; }
  } else { den = den + aP; }
  if (iz > 0) {
    if (solidCell(iz - 1, ir) == FLUID) { cW = b; den = den + b; }
  } else { den = den + b; }
  if (iz < nz - 1) {
    if (solidCell(iz + 1, ir) == FLUID) { cE = b; den = den + b; }
  } else { den = den + b; }
  var inv = 0.0;
  if (den > 1e-12) { inv = 1.0 / den; }
  coefB[k] = vec4<f32>(cW, cE, cS, cN) * inv;
  divB[k]  = (divB[k] / P.dtlz.x) * inv;
}

/* One Jacobi iteration per dispatch, straight out of global memory.
   A shared-memory version carrying four iterations per dispatch was tried and measured
   1.69x SLOWER (17.1 vs 10.1 us per iteration): a compute dispatch costs only ~4 us here,
   so there is nothing to amortise, and the halo makes the workgroup do 2.25x the cells.
   This kernel is memory-bandwidth bound, which is the right place to be. */
@compute @workgroup_size(64, 1)
fn jacobiSimple(@builtin(global_invocation_id) g : vec3<u32>) {
  let iz = i32(g.x); let ir = i32(g.y);
  if (iz >= P.cells.x || ir >= P.cells.y) { return; }
  let nz = P.cells.x; let nr = P.cells.y;
  let k = u32(ir * nz + iz);
  let pW = preS[u32(ir * nz + max(iz - 1, 0))];
  let pE = preS[u32(ir * nz + min(iz + 1, nz - 1))];
  let pS = preS[u32(max(ir - 1, 0) * nz + iz)];
  let pN = preS[u32(min(ir + 1, nr - 1) * nz + iz)];
  preD[k] = dot(coefB[k], vec4<f32>(pW, pE, pS, pN)) - divB[k];
}

@compute @workgroup_size(64)
fn probeGather(@builtin(global_invocation_id) g : vec3<u32>) {
  let ir = i32(g.x);
  if (ir >= P.faces.y) { return; }
  probeB[u32(ir)] = fV(i32(P.misc.y), ir).y;
}
`;

/* ---- max |u_r|, |u_z| by workgroup reduction; two dispatches instead of ten ---- */
const WGSL_REDUCE = `
struct RP { n : u32, first : u32, _a : u32, _b : u32 };
@group(0) @binding(0) var<uniform> R : RP;
@group(1) @binding(0) var<storage, read>       src : array<vec2<f32>>;
@group(1) @binding(1) var<storage, read_write> dst : array<vec2<f32>>;

var<workgroup> sh : array<vec2<f32>, 256>;

@compute @workgroup_size(256)
fn reduceMax(@builtin(global_invocation_id) g : vec3<u32>,
             @builtin(local_invocation_index) tid : u32,
             @builtin(workgroup_id) wid : vec3<u32>) {
  var v = vec2<f32>(0.0);
  if (g.x < R.n) {
    v = src[g.x];
    if (R.first == 1u) { v = abs(v); }
  }
  sh[tid] = v;
  workgroupBarrier();
  var s = 128u;
  loop {
    if (s == 0u) { break; }
    if (tid < s) { sh[tid] = max(sh[tid], sh[tid + s]); }
    workgroupBarrier();
    s = s >> 1u;
  }
  if (tid == 0u) { dst[wid.x] = sh[0]; }
}
`;

/* ---- display: one full-screen triangle, fragment reads the storage buffers ---- */
const WGSL_SHOW = WGSL_PARAMS + WGSL_DECLS_S + WGSL_HELPERS + `
struct Show {
  viewport : vec2<f32>,
  field    : f32,
  scale    : f32,
  showGeom : f32,
  probeZ   : f32,
  _pad     : vec2<f32>,
};
@group(2) @binding(0) var<uniform> SH : Show;

@vertex
fn vs(@builtin(vertex_index) vi : u32) -> @builtin(position) vec4<f32> {
  let v = vec2<f32>(f32((vi << 1u) & 2u), f32(vi & 2u));
  return vec4<f32>(v * 2.0 - 1.0, 0.0, 1.0);
}

fn viridis(t0 : f32) -> vec3<f32> {
  let t = clamp(t0, 0.0, 1.0);
  let c0 = vec3<f32>(0.2777, 0.0054, 0.3341);
  let c1 = vec3<f32>(0.1051, 1.4046, 1.3846);
  let c2 = vec3<f32>(-0.3309, 0.2148, 0.0951);
  let c3 = vec3<f32>(-4.6342, -5.7991, -19.3324);
  let c4 = vec3<f32>(6.2283, 14.1799, 56.6906);
  let c5 = vec3<f32>(4.7764, -13.7451, -65.3530);
  let c6 = vec3<f32>(-5.4355, 4.6459, 26.3124);
  return clamp(c0 + t * (c1 + t * (c2 + t * (c3 + t * (c4 + t * (c5 + t * c6))))),
               vec3<f32>(0.0), vec3<f32>(1.0));
}
fn diverging(t : f32) -> vec3<f32> {
  let a = clamp(abs(t), 0.0, 1.0);
  var c = vec3<f32>(1.0, 0.42, 0.25);
  if (t < 0.0) { c = vec3<f32>(0.25, 0.55, 1.0); }
  return mix(vec3<f32>(0.055, 0.07, 0.09), c, pow(a, 0.75));
}

@fragment
fn fs(@builtin(position) fc : vec4<f32>) -> @location(0) vec4<f32> {
  let uv = vec2<f32>(fc.x / SH.viewport.x, 1.0 - fc.y / SH.viewport.y);
  let z  = uv.x * P.dtlz.y;
  let rs = (uv.y - 0.5) * 2.0 * P.geoA.x;
  let r  = abs(rs);
  let p  = vec2<f32>(z, r);
  let iz = clamp(i32(floor(z / P.d.x)), 0, P.cells.x - 1);
  let ir = clamp(i32(floor(r / P.d.y)), 0, P.cells.y - 1);

  var col = vec3<f32>(0.055, 0.07, 0.09);
  let sld = solidAt(p);
  let fld = i32(SH.field);

  if (sld == FLUID) {
    let uzc = 0.5 * (fV(iz, ir).y + fV(iz + 1, ir).y);
    let urc = 0.5 * (fV(iz, ir).x + fV(iz, ir + 1).x);
    if (fld == 0) {
      let d = clamp(sampleDye(p), 0.0, 1.0);
      col = mix(col, vec3<f32>(0.86, 0.93, 1.0), pow(d, 0.7));
    } else if (fld == 1) {
      col = viridis(length(vec2<f32>(uzc, urc)) / max(SH.scale, 1e-6));
    } else if (fld == 2) {
      let w = 0.25 * (fW(iz, ir) + fW(iz + 1, ir) + fW(iz, ir + 1) + fW(iz + 1, ir + 1));
      var sgn = 1.0;
      if ((uv.y - 0.5) < 0.0) { sgn = -1.0; }
      col = diverging(clamp(sgn * w / max(SH.scale, 1e-6), -1.0, 1.0));
    } else if (fld == 3) {
      col = diverging(clamp(fP(iz, ir) / max(SH.scale, 1e-6), -1.0, 1.0));
    } else {
      col = diverging(clamp(uzc / max(SH.scale, 1e-6), -1.0, 1.0));
    }
    if (fld != 0) { col = mix(col, vec3<f32>(1.0), 0.16 * clamp(sampleDye(p), 0.0, 1.0)); }
  } else if (SH.showGeom > 0.5) {
    if (sld == PISTON) { col = vec3<f32>(0.83, 0.55, 0.20); }
    else { col = vec3<f32>(0.30, 0.35, 0.42); }
    if (fract((z * 0.5 + r * 0.5) / 3.0) < 0.5) { col = col + 0.04; }
  } else {
    col = vec3<f32>(0.10, 0.11, 0.13);
  }
  if (abs(uv.y - 0.5) * SH.viewport.y < 0.6) { col = mix(col, vec3<f32>(0.45, 0.55, 0.65), 0.5); }
  if (abs(z - SH.probeZ) < P.d.x * 0.6) { col = mix(col, vec3<f32>(1.0, 0.85, 0.35), 0.45); }
  return vec4<f32>(col, 1.0);
}
`;

/* ========================== device, buffers, pipelines ========================== */
const PARAM_STRIDE = 256;                 // uniform dynamic-offset alignment
const PARAM_FLOATS = PARAM_STRIDE / 4;

async function wgpuInit(){
  if (!navigator.gpu) return false;
  let ad, dev;
  try {
    ad = await navigator.gpu.requestAdapter({ powerPreference:'high-performance' });
    if (!ad) return false;
    const want = Math.min(10, ad.limits.maxStorageBuffersPerShaderStage || 8);
    dev = await ad.requestDevice({ requiredLimits:{ maxStorageBuffersPerShaderStage: want } });
  } catch (e){ return false; }
  WG.dev = dev;
  WG.canvas = document.getElementById('viewgpu');
  WG.ctx = WG.canvas.getContext('webgpu');
  if (!WG.ctx) return false;
  WG.fmt = navigator.gpu.getPreferredCanvasFormat();
  WG.ctx.configure({ device: dev, format: WG.fmt, alphaMode:'opaque' });

  dev.onuncapturederror = e => {
    console.error('WebGPU', e.error);
    if (!WG.failed){ WG.failed = true; wgpuFail(e.error && e.error.message || 'device error'); }
  };

  const modK = dev.createShaderModule({ code: WGSL_KERNELS });
  const modR = dev.createShaderModule({ code: WGSL_REDUCE });
  const modS = dev.createShaderModule({ code: WGSL_SHOW });
  for (const m of [modK, modR, modS]){
    const info = await m.getCompilationInfo();
    const bad = info.messages.filter(x => x.type === 'error');
    if (bad.length){ console.error(bad); wgpuFail(bad[0].message); return false; }
  }

  // ---- bind group layouts ----
  const uni = (dyn) => ({ binding:0, visibility:GPUShaderStage.COMPUTE | GPUShaderStage.FRAGMENT,
                          buffer:{ type:'uniform', hasDynamicOffset:!!dyn } });
  WG.bglP = dev.createBindGroupLayout({ entries:[uni(true)] });
  const st = (b, ro) => ({ binding:b, visibility:GPUShaderStage.COMPUTE,
                           buffer:{ type: ro ? 'read-only-storage' : 'storage' } });
  WG.bglF = dev.createBindGroupLayout({ entries:[
    st(0,true), st(1,false), st(2,true), st(3,false), st(4,false),
    st(5,false), st(6,true), st(7,false), st(8,false), st(9,false) ] });
  const sr = b => ({ binding:b, visibility:GPUShaderStage.FRAGMENT,
                     buffer:{ type:'read-only-storage' } });
  WG.bglFS = dev.createBindGroupLayout({ entries:[ sr(0), sr(1), sr(2), sr(3) ] });
  WG.bglS = dev.createBindGroupLayout({ entries:[
    { binding:0, visibility:GPUShaderStage.FRAGMENT, buffer:{ type:'uniform' } } ] });
  WG.bglRP = dev.createBindGroupLayout({ entries:[
    { binding:0, visibility:GPUShaderStage.COMPUTE, buffer:{ type:'uniform', hasDynamicOffset:true } } ] });
  WG.bglR = dev.createBindGroupLayout({ entries:[
    { binding:0, visibility:GPUShaderStage.COMPUTE, buffer:{ type:'read-only-storage' } },
    { binding:1, visibility:GPUShaderStage.COMPUTE, buffer:{ type:'storage' } } ] });

  const plK = dev.createPipelineLayout({ bindGroupLayouts:[WG.bglP, WG.bglF] });
  const plR = dev.createPipelineLayout({ bindGroupLayouts:[WG.bglRP, WG.bglR] });
  const plS = dev.createPipelineLayout({ bindGroupLayouts:[WG.bglP, WG.bglFS, WG.bglS] });

  WG.pipe = {};
  for (const name of ['advectVel','vorticity','forces','divergence','project',
                      'advectDye','dyeInit','clearAll','probeGather','prepare','jacobiSimple'])
    WG.pipe[name] = dev.createComputePipeline({ layout:plK, compute:{ module:modK, entryPoint:name } });
  WG.pipe.reduceMax = dev.createComputePipeline({ layout:plR, compute:{ module:modR, entryPoint:'reduceMax' } });
  WG.pipe.show = dev.createRenderPipeline({
    layout: plS,
    vertex:   { module:modS, entryPoint:'vs' },
    fragment: { module:modS, entryPoint:'fs', targets:[{ format:WG.fmt }] },
    primitive:{ topology:'triangle-list' } });

  WG.ok = true;
  return true;
}

function wgpuFail(msg){
  WG.ok = false;
  const el = document.getElementById('diverged');
  if (el){ el.style.display='block';
    el.innerHTML = `<b>WebGPU failed, fell back to WebGL2.</b> ${msg}`; }
}

function wgpuAlloc(){
  const dev = WG.dev, B = WG.buf || (WG.buf = {});
  for (const k in B) if (B[k] && B[k].destroy) B[k].destroy();
  WG.buf = {};
  const nF = (S.Nz + 1) * (S.Nr + 1), nC = S.Nz * S.Nr;
  const SU = GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC | GPUBufferUsage.COPY_DST;
  const mk = (n, bytes) => dev.createBuffer({ size: Math.max(16, n * bytes), usage: SU });
  const B2 = WG.buf;
  B2.velA = mk(nF, 8); B2.velB = mk(nF, 8);
  B2.preA = mk(nC, 4); B2.preB = mk(nC, 4);
  B2.div  = mk(nC, 4); B2.vor  = mk(nF, 4);
  B2.dyeA = mk(nC, 4); B2.dyeB = mk(nC, 4);
  B2.probe = mk(S.Nr + 1, 4);
  B2.coef  = mk(nC, 16);

  WG.nSteps = 0;
  B2.params = dev.createBuffer({ size: PARAM_STRIDE * 2048,
    usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
  WG.paramHost = new ArrayBuffer(PARAM_STRIDE * 2048);
  WG.paramF = new Float32Array(WG.paramHost);
  WG.paramI = new Int32Array(WG.paramHost);

  // one field bind group per (vel, pres, dye) parity
  WG.bgF = [];
  for (let m = 0; m < 8; m++){
    const v = (m & 4) ? 1 : 0, q = (m & 2) ? 1 : 0, y = (m & 1) ? 1 : 0;
    WG.bgF.push(dev.createBindGroup({ layout:WG.bglF, entries:[
      { binding:0, resource:{ buffer: v ? B2.velB : B2.velA } },
      { binding:1, resource:{ buffer: v ? B2.velA : B2.velB } },
      { binding:2, resource:{ buffer: q ? B2.preB : B2.preA } },
      { binding:3, resource:{ buffer: q ? B2.preA : B2.preB } },
      { binding:4, resource:{ buffer: B2.div } },
      { binding:5, resource:{ buffer: B2.vor } },
      { binding:6, resource:{ buffer: y ? B2.dyeB : B2.dyeA } },
      { binding:7, resource:{ buffer: y ? B2.dyeA : B2.dyeB } },
      { binding:8, resource:{ buffer: B2.probe } },
      { binding:9, resource:{ buffer: B2.coef } } ]}));
  }
  WG.bgFS = [];
  for (let m = 0; m < 8; m++){
    const v = (m & 4) ? 1 : 0, q = (m & 2) ? 1 : 0, y = (m & 1) ? 1 : 0;
    WG.bgFS.push(dev.createBindGroup({ layout:WG.bglFS, entries:[
      { binding:0, resource:{ buffer: v ? B2.velB : B2.velA } },
      { binding:1, resource:{ buffer: q ? B2.preB : B2.preA } },
      { binding:2, resource:{ buffer: B2.vor } },
      { binding:3, resource:{ buffer: y ? B2.dyeB : B2.dyeA } } ]}));
  }
  WG.bgP = dev.createBindGroup({ layout:WG.bglP, entries:[
    { binding:0, resource:{ buffer:B2.params, size:112 } }] });

  // reduction chain
  B2.showU = dev.createBuffer({ size:32, usage:GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
  WG.bgS = dev.createBindGroup({ layout:WG.bglS, entries:[{ binding:0, resource:{ buffer:B2.showU }}] });

  WG.redLevels = [];
  let n = nF, lvl = 0, srcBuf = B2.velA, srcBufAlt = B2.velB;
  const redParams = [];
  while (n > 1){
    const outN = Math.ceil(n / 256);
    const out = mk(outN, 8);
    WG.redLevels.push({ n, outN, out });
    redParams.push(n, lvl === 0 ? 1 : 0, 0, 0);
    n = outN; lvl++;
  }
  B2.redParams = dev.createBuffer({ size: PARAM_STRIDE * Math.max(1, WG.redLevels.length),
    usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
  const rp = new Uint32Array(PARAM_STRIDE * Math.max(1, WG.redLevels.length) / 4);
  WG.redLevels.forEach((L, i) => { rp[i * PARAM_FLOATS] = L.n; rp[i * PARAM_FLOATS + 1] = i === 0 ? 1 : 0; });
  dev.queue.writeBuffer(B2.redParams, 0, rp);
  WG.bgRP = dev.createBindGroup({ layout:WG.bglRP, entries:[
    { binding:0, resource:{ buffer:B2.redParams, size:16 }}] });

  // reduce bind groups: level 0 has two variants (velA / velB), rest are fixed
  WG.bgRed = WG.redLevels.map((L, i) => {
    if (i === 0) return [
      dev.createBindGroup({ layout:WG.bglR, entries:[
        { binding:0, resource:{ buffer:B2.velA }}, { binding:1, resource:{ buffer:L.out }}]}),
      dev.createBindGroup({ layout:WG.bglR, entries:[
        { binding:0, resource:{ buffer:B2.velB }}, { binding:1, resource:{ buffer:L.out }}]})];
    return [dev.createBindGroup({ layout:WG.bglR, entries:[
      { binding:0, resource:{ buffer:WG.redLevels[i-1].out }}, { binding:1, resource:{ buffer:L.out }}]})];
  });

  // staging buffers for readback
  WG.stageMax   = dev.createBuffer({ size:8,  usage:GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
  WG.stageProbe = dev.createBuffer({ size:Math.max(16,(S.Nr+1)*4),
    usage:GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
  WG.mapBusy = false;
  WG.gen = (WG.gen || 0) + 1;      // invalidates readbacks still in flight from the old grid
  WG.velPar = 0; WG.prePar = 0; WG.dyePar = 0;
}

/* ---- pack one step's uniforms into slot `slot` of the dynamic-offset buffer ---- */
function wgpuParams(slot, dt){
  const F = WG.paramF, I = WG.paramI, o = slot * PARAM_FLOATS;
  I[o+0] = S.Nz;      I[o+1] = S.Nr;
  I[o+2] = S.Nz + 1;  I[o+3] = S.Nr + 1;
  F[o+4] = S.dz;      F[o+5] = S.dr;
  F[o+6] = dt;        F[o+7] = S.Lz;
  F[o+8] = S.Rmax;    F[o+9] = S.Z0;  F[o+10] = S.Z1;   F[o+11] = P.boreR;
  F[o+12]= P.wallT;   F[o+13]= Math.min(P.exitR, P.boreR);
  F[o+14]= P.plateT;  F[o+15]= Math.min(P.taper, P.barrelLen - 2);
  const pz0 = pistonBackStart() + S.pistonX;
  F[o+16]= pz0;       F[o+17]= pz0 + P.pistonT;
  F[o+18]= Math.max(0.1, P.boreR - P.pistonClr);
  F[o+19]= S.pistonV;
  F[o+20]= P.visc;    F[o+21]= P.vortEps; F[o+22]= P.dyeDiss; F[o+23]= P.smag;
  F[o+24]= S.firing ? 1 : 0;
  F[o+25]= probeIz().iz;
}

const wgDispatch = (pass, pipe, nx, ny, wx, wy) => {
  pass.setPipeline(pipe);
  pass.dispatchWorkgroups(Math.ceil(nx / wx), Math.ceil(ny / wy));
};

/* ---- every step of the frame goes into one command encoder, submitted once ---- */
function wgpuSteps(n){
  const dev = WG.dev, B = WG.buf;
  const maxSlots = 2048;
  n = Math.min(n, maxSlots);

  // decide every timestep up front so the uniforms can be uploaded in one go
  const dts = [];
  let tSim = S.t, simmed = 0;
  const savedT = S.t, savedX = S.pistonX, savedV = S.pistonV, savedF = S.firing;
  for (let i = 0; i < n; i++){
    S.t = tSim;
    const k = pistonKinematics(tSim);
    S.pistonX = k.x; S.pistonV = k.v; S.firing = tSim < P.pushMs;
    const dt = chooseDt();
    wgpuParams(i, dt);
    dts.push(dt); tSim += dt; simmed += dt;
  }
  S.t = savedT; S.pistonX = savedX; S.pistonV = savedV; S.firing = savedF;
  dev.queue.writeBuffer(B.params, 0, WG.paramHost, 0, n * PARAM_STRIDE);

  const nF = (S.Nz + 1), nFr = (S.Nr + 1);
  const nJx = Math.ceil(S.Nz / 64);

  const enc = dev.createCommandEncoder();
  const pass = enc.beginComputePass();
  for (let i = 0; i < n; i++){
    const off = [i * PARAM_STRIDE];
    const bg = () => WG.bgF[(WG.velPar ? 4 : 0) | (WG.prePar ? 2 : 0) | (WG.dyePar ? 1 : 0)];
    pass.setBindGroup(0, WG.bgP, off);

    pass.setBindGroup(1, bg()); wgDispatch(pass, WG.pipe.advectVel, nF, nFr, 8, 8); WG.velPar ^= 1;
    pass.setBindGroup(1, bg()); wgDispatch(pass, WG.pipe.vorticity, nF, nFr, 8, 8);
    pass.setBindGroup(1, bg()); wgDispatch(pass, WG.pipe.forces,    nF, nFr, 8, 8); WG.velPar ^= 1;
    pass.setBindGroup(1, bg()); wgDispatch(pass, WG.pipe.divergence, S.Nz, S.Nr, 8, 8);
    pass.setBindGroup(1, bg()); wgDispatch(pass, WG.pipe.prepare,    S.Nz, S.Nr, 8, 8);
    for (let j = 0; j < P.iters; j++){
      pass.setBindGroup(1, bg());
      pass.setPipeline(WG.pipe.jacobiSimple);
      pass.dispatchWorkgroups(nJx, S.Nr);
      WG.prePar ^= 1;
    }
    pass.setBindGroup(1, bg()); wgDispatch(pass, WG.pipe.project, nF, nFr, 8, 8); WG.velPar ^= 1;
    pass.setBindGroup(1, bg()); wgDispatch(pass, WG.pipe.advectDye, S.Nz, S.Nr, 8, 8); WG.dyePar ^= 1;
  }

  // max |u| reduction + probe column, on the final state
  pass.setBindGroup(0, WG.bgP, [(n - 1) * PARAM_STRIDE]);
  pass.setBindGroup(1, WG.bgF[(WG.velPar ? 4 : 0) | (WG.prePar ? 2 : 0) | (WG.dyePar ? 1 : 0)]);
  pass.setPipeline(WG.pipe.probeGather);
  pass.dispatchWorkgroups(Math.ceil((S.Nr + 1) / 64));

  pass.setPipeline(WG.pipe.reduceMax);
  WG.redLevels.forEach((L, i) => {
    pass.setBindGroup(0, WG.bgRP, [i * PARAM_STRIDE]);
    pass.setBindGroup(1, WG.bgRed[i][i === 0 ? WG.velPar : 0]);
    pass.dispatchWorkgroups(Math.ceil(L.n / 256));
  });
  pass.end();

  const last = WG.redLevels[WG.redLevels.length - 1];
  // Capture the staging buffers and the grid generation now: a rebuild may swap both out
  // before this readback resolves, and unmapping the wrong buffer corrupts the next submit.
  const sMax = WG.stageMax, sProbe = WG.stageProbe, gen = WG.gen, nr = S.Nr;
  if (!WG.mapBusy){
    enc.copyBufferToBuffer(last.out, 0, sMax, 0, 8);
    enc.copyBufferToBuffer(WG.buf.probe, 0, sProbe, 0, (nr + 1) * 4);
  }
  dev.queue.submit([enc.finish()]);

  if (!WG.mapBusy){
    WG.mapBusy = true;
    const tag = S.t + simmed;
    Promise.all([sMax.mapAsync(GPUMapMode.READ),
                 sProbe.mapAsync(GPUMapMode.READ)]).then(() => {
      const m  = new Float32Array(sMax.getMappedRange().slice(0));
      const pr = new Float32Array(sProbe.getMappedRange().slice(0));
      sMax.unmap(); sProbe.unmap();
      if (gen !== WG.gen) return;            // stale sample from a grid that no longer exists
      WG.mapBusy = false;
      if (!Number.isFinite(m[0]) || !Number.isFinite(m[1]) || Math.max(m[0], m[1]) > 5000){
        flagDivergence(Math.max(m[0], m[1]));
      } else {
        S.vrmax = Math.max(m[0], 0.05);
        S.vzmax = Math.max(m[1], 0.05);
        S.vmax  = Math.max(m[0], m[1], 0.05);
      }
      consumeProbeArr(pr, tag);
    }).catch(() => { if (gen === WG.gen) WG.mapBusy = false; });
  }

  S.t += simmed;
  const k = pistonKinematics(S.t);
  S.pistonX = k.x; S.pistonV = k.v; S.firing = S.t < P.pushMs;
  return simmed;
}

/* probe buffer is a plain u_z column, not the interleaved RGBA the GL path reads */
function consumeProbeArr(buf, t){
  const axis = buf[0];
  let mx = 0, Q = 0, mom = 0;
  for (let ir = 0; ir < S.Nr; ir++){
    const uz = buf[ir];
    if (!Number.isFinite(uz)) continue;
    if (Math.abs(uz) > Math.abs(mx)) mx = uz;
    const rc = (ir + 0.5) * S.dr, dA = 2 * Math.PI * rc * S.dr;
    if (uz > 0){ Q += uz * dA; mom += uz * uz * dA; }
  }
  S.meas = { axis, mx, Q, mom };
  if (mx > S.peak){ S.peak = mx; S.peakT = t; }
  if (S.arrival < 0 && mx > 0.25) S.arrival = t;
  S.series.push([t, axis, mx]);
  if (S.series.length > 4000) S.series.splice(0, 2000);
}

function wgpuReset(){
  const dev = WG.dev;
  wgpuParams(0, 0.01);
  dev.queue.writeBuffer(WG.buf.params, 0, WG.paramHost, 0, PARAM_STRIDE);
  WG.velPar = 0; WG.prePar = 0; WG.dyePar = 0;
  const enc = dev.createCommandEncoder();
  const pass = enc.beginComputePass();
  pass.setBindGroup(0, WG.bgP, [0]);
  const bg = () => WG.bgF[(WG.velPar ? 4 : 0) | (WG.prePar ? 2 : 0) | (WG.dyePar ? 1 : 0)];
  // clearAll writes velD/preD/vor/div; run it for both parities so every buffer is zeroed
  for (let i = 0; i < 2; i++){
    pass.setBindGroup(1, bg());
    wgDispatch(pass, WG.pipe.clearAll, S.Nz + 1, S.Nr + 1, 8, 8);
    WG.velPar ^= 1; WG.prePar ^= 1;
  }
  for (let i = 0; i < 2; i++){
    pass.setBindGroup(1, bg());
    wgDispatch(pass, WG.pipe.dyeInit, S.Nz, S.Nr, 8, 8);
    WG.dyePar ^= 1;
  }
  pass.end();
  dev.queue.submit([enc.finish()]);
}

function wgpuRender(){
  const dev = WG.dev;
  const cv = WG.canvas;
  const w = cv.width, h = cv.height;
  const g = VIEW.gain;
  let base;
  switch (VIEW.field){
    case 1: base = Math.max(S.vmax * 0.75, 1e-3); break;
    case 2: base = Math.max(S.vmax / Math.min(S.dz, S.dr) * 0.12, 1e-3); break;
    case 3: base = Math.max(S.vmax * S.vmax * 0.4, 1e-3); break;
    case 4: base = Math.max(S.vmax * 0.75, 1e-3); break;
    default: base = 1;
  }
  const su = new Float32Array(8);
  su[0] = w; su[1] = h; su[2] = VIEW.field; su[3] = base / g;
  su[4] = VIEW.showGeom ? 1 : 0;
  su[5] = Math.min(S.Lz - S.dz, S.Z1 + P.plateT + P.probe);
  dev.queue.writeBuffer(WG.buf.showU, 0, su);

  const enc = dev.createCommandEncoder();
  const pass = enc.beginRenderPass({ colorAttachments:[{
    view: WG.ctx.getCurrentTexture().createView(),
    clearValue:{ r:0.02, g:0.03, b:0.04, a:1 }, loadOp:'clear', storeOp:'store' }] });
  pass.setPipeline(WG.pipe.show);
  pass.setBindGroup(0, WG.bgP, [0]);
  pass.setBindGroup(1, WG.bgFS[(WG.velPar ? 4 : 0) | (WG.prePar ? 2 : 0) | (WG.dyePar ? 1 : 0)]);
  pass.setBindGroup(2, WG.bgS);
  pass.draw(3);
  pass.end();
  dev.queue.submit([enc.finish()]);
}
</script>

<script>
"use strict";
/* ========================== control panel ========================== */
const DOM = { scalebar: document.getElementById('scalebar'),
              pause:    document.getElementById('pause'),
              metrics:  document.getElementById('metrics'),
              plotTitle:document.getElementById('plotTitle') };
const host = document.getElementById('controls');
const sliders = {};
let pendingRebuild = false;

function fmtVal(it, v){
  const d = it.step >= 1 ? 0 : (it.step >= 0.1 ? 1 : (it.step >= 0.01 ? 2 : 4));
  return v.toFixed(d) + (it.unit ? ' ' + it.unit : '');
}

function addControl(body, it){
  const wrap = document.createElement('div');
  wrap.className = 'ctl' + (it.rebuild ? ' rebuild' : '');
  wrap.innerHTML =
    `<div class="lab"><span>${it.t}</span><span id="v_${it.k}">${fmtVal(it, it.v)}</span></div>` +
    `<input type="range" id="s_${it.k}" min="${it.min}" max="${it.max}" step="${it.step}" value="${it.v}">` +
    (it.hint ? `<div class="hint">${it.hint}</div>` : '');
  body.appendChild(wrap);
  const inp = wrap.querySelector('input');
  sliders[it.k] = { inp, out: wrap.querySelector('#v_' + it.k), it };
  inp.addEventListener('input', () => {
    P[it.k] = parseFloat(inp.value);
    sliders[it.k].out.textContent = fmtVal(it, P[it.k]);
    if (it.rebuild) pendingRebuild = true;
    updateMetrics();
  });
}

for (const g of CONTROLS){
  const d = document.createElement('details');
  if (g.open) d.open = true;
  d.innerHTML = `<summary>${g.group}</summary><div class="body"></div>`;
  const body = d.querySelector('.body');
  for (const it of g.items) addControl(body, it);
  host.appendChild(d);
}

/* ---- pacing toggle, appended to the solver section ---- */
{
  const solver = [...host.querySelectorAll('details')]
    .find(d => d.querySelector('summary').textContent.startsWith('Domain'));
  const wrap = document.createElement('label');
  wrap.className = 'chk';
  wrap.innerHTML = `<input type="checkbox" id="autoPace" checked> Auto-pace to the frame budget`;
  solver.querySelector('.body').prepend(wrap);
  wrap.querySelector('input').addEventListener('change', e => {
    OPT.autoPace = e.target.checked;
    if (!OPT.autoPace) P.spf = Math.max(1, Math.round(S.spfAuto));
  });
}

/* ---- display section ---- */
{
  const d = document.createElement('details');
  d.open = true;
  d.innerHTML = `<summary>Display</summary><div class="body">
    <div class="ctl"><div class="lab"><span>Field</span></div>
      <select id="fieldSel">
        <option value="0">Tracer (barrel air)</option>
        <option value="1">Speed |u|</option>
        <option value="2">Vorticity (ring cores)</option>
        <option value="3">Pressure</option>
        <option value="4">Axial velocity u_z</option>
      </select></div>
    <div class="ctl"><div class="lab"><span>Colour gain</span><span id="v_gain">1.0×</span></div>
      <input type="range" id="s_gain" min="-1.2" max="1.5" step="0.02" value="0"></div>
    <label class="chk"><input type="checkbox" id="geomChk" checked> Draw the hardware</label>
  </div>`;
  host.appendChild(d);
  const gainOut = d.querySelector('#v_gain'), gainIn = d.querySelector('#s_gain');
  VIEW.gain = 1;
  gainIn.addEventListener('input', () => {
    VIEW.gain = Math.pow(10, parseFloat(gainIn.value));
    gainOut.textContent = VIEW.gain.toFixed(VIEW.gain < 1 ? 2 : 1) + '×';
  });
  d.querySelector('#fieldSel').addEventListener('change', e => VIEW.field = parseInt(e.target.value));
  d.querySelector('#geomChk').addEventListener('change', e => VIEW.showGeom = e.target.checked);
}

/* ---- quality presets: the solver knobs that actually trade speed for fidelity ---- */
const QUALITY = [
  { n:'Draft',    d:'coarse, for sweeping parameters', q:{ res:64,  iters:40, cfl:1.0 } },
  { n:'Balanced', d:'the shipped default',             q:{ res:112, iters:50, cfl:0.8 } },
  { n:'Accurate', d:'slow; for a final check',         q:{ res:192, iters:90, cfl:0.5 } },
];
{
  const d = document.createElement('details');
  d.open = true;
  d.innerHTML = `<summary>Quality</summary><div class="body">
    <div class="btnrow presets" id="qrow"></div>
    <div class="hint" style="margin-top:6px">Cost is dominated by the number of render
    passes, which is <i>steps × pressure iterations</i>. A finer grid costs you mainly through
    the smaller timestep it forces, not through the extra pixels.</div></div>`;
  const row = d.querySelector('#qrow');
  for (const q of QUALITY){
    const b = document.createElement('button');
    b.innerHTML = `<b>${q.n}</b><i>${q.d}</i>`;
    b.addEventListener('click', () => {
      Object.assign(P, q.q); syncSliders(); buildGrid(); updateMetrics();
    });
    row.appendChild(b);
  }
  host.appendChild(d);
}

/* ---- presets ---- */
{
  const d = document.createElement('details');
  d.open = true;
  d.innerHTML = `<summary>Geometry presets</summary><div class="body"><div class="btnrow presets"></div></div>`;
  const row = d.querySelector('.presets');
  for (const pr of PRESETS){
    const b = document.createElement('button');
    b.innerHTML = `<b>${pr.n}</b><i>${pr.d}</i>`;
    b.addEventListener('click', () => {
      Object.assign(P, pr.p);
      if (pr.auto === 'ld4')
        P.exitR = Math.round(Math.cbrt(P.boreR*P.boreR*Math.min(P.stroke, maxStroke())/8) * 2) / 2;
      syncSliders();
      buildGrid(); updateMetrics();
    });
    row.appendChild(b);
  }
  host.appendChild(d);
}

function syncSliders(){
  for (const k in sliders){
    const s = sliders[k];
    s.inp.value = P[k];
    P[k] = parseFloat(s.inp.value);          // re-read so clamping to slider range applies
    s.out.textContent = fmtVal(s.it, P[k]);
  }
}

document.getElementById('note').innerHTML =
  `<b>↻</b> marks parameters that rebuild the grid and restart the shot.
   <b>Enter</b> fires, <b>space</b> pauses.<br><br>
   Geometry comes from <code>airzooker.scad</code>. The flange and the handle greebles sit outside
   the flow and are not modelled; the barrel is treated as open at the back so air can refill
   behind the piston.<br><br>
   <b>What to trust.</b> This is an <i>axisymmetric</i> solver, so it forms and propagates vortex
   <i>rings</i> properly — a plain planar 2D solver gives vortex pairs that behave quite
   differently. Ring formation, pinch-off and the L/D physics are the parts worth believing.<br><br>
   <b>What not to trust.</b> Absolute range is optimistic. A real jet breaks up through 3-D
   instabilities that circular symmetry forbids by construction, so without help the jet here
   stays laminar and flies too far. The Smagorinsky term is a stand-in for that missing mixing,
   not a substitute for it. The solver is also incompressible, so any design whose exit speed
   approaches Mach 0.3 is outside what it can model. Use it to rank designs against each other,
   not to predict metres.`;

/* ---- buttons & keys ---- */
document.getElementById('fire').addEventListener('click', () => {
  if (pendingRebuild){ buildGrid(); pendingRebuild = false; } else resetSim();
  S.running = true; S.spfAuto = 8; DOM.pause.textContent = 'Pause';
});
document.getElementById('reset').addEventListener('click', () => { buildGrid(); pendingRebuild = false; });
DOM.pause.addEventListener('click', e => {
  if (S.diverged) return;
  S.running = !S.running; e.target.textContent = S.running ? 'Pause' : 'Run';
});
window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.key === 'Enter'){ document.getElementById('fire').click(); e.preventDefault(); }
  if (e.key === ' ')    { document.getElementById('pause').click(); e.preventDefault(); }
});

/* ========================== main loop ========================== */
const hud = document.getElementById('hud');
let lastWall = performance.now(), lastUi = 0, fps = 60;

function frame(){
  if (pendingRebuild && !S.running){ buildGrid(); pendingRebuild = false; }

  if (S.running && !S.diverged){
    if (pendingRebuild){ buildGrid(); pendingRebuild = false; }
    let simmed = 0;
    const n = OPT.autoPace ? Math.max(1, Math.round(S.spfAuto)) : P.spf;
    if (WG.ok){
      simmed = wgpuSteps(n);
    } else {
      for (let i = 0; i < n; i++){ const dt = chooseDt(); step(dt); simmed += dt; }
    }
    S.frameDt = simmed;
  }
  if (!WG.ok && readerPoll(S.rdMax)){
    const vr = S.rdMax.data[0], vz = S.rdMax.data[1];
    if (!Number.isFinite(vr) || !Number.isFinite(vz) || Math.max(vr, vz) > 5000)
      flagDivergence(Math.max(vr, vz));
    else {
      S.vrmax = Math.max(vr, 0.05);
      S.vzmax = Math.max(vz, 0.05);
      S.vmax  = Math.max(vr, vz, 0.05);
    }
  }
  if (!WG.ok && readerPoll(S.rdProbe)) consumeProbe(S.rdProbe.data, S.rdProbe.tag);
  if (!WG.ok && S.running){
    readerIssue(S.rdMax, reduceRender().fbo, 0, 0, 1, 1);
    S.rdProbe.tag = S.t;
    readerIssue(S.rdProbe, S.vel.read.fbo, probeIz().iz, 0, 1, S.Nr + 1);
  }
  render();

  const now = performance.now();
  const wall = Math.min(Math.max(now - lastWall, 1), 500);
  lastWall = now;
  S.wallSmooth += (wall - S.wallSmooth) * 0.15;
  fps += ((1000/wall) - fps) * 0.1;
  S.simRate = S.frameDt * 1000 / Math.max(S.wallSmooth, 1);

  // Steer steps-per-frame towards the frame budget. Nothing else adapts to the wide range
  // of timestep sizes the geometry produces, so without this a small orifice is a slideshow.
  if (OPT.autoPace && S.running && !S.diverged){
    if (S.wallSmooth > P.budget * 1.15)      S.spfAuto = Math.max(1, S.spfAuto * 0.85);
    else if (S.wallSmooth < P.budget * 0.85) S.spfAuto = Math.min(2000, S.spfAuto * 1.10);
  }

  // The plot and the metrics panel are DOM work; at 60 Hz they cost more than the solver.
  if (now - lastUi > 90){
    lastUi = now;
    drawPlot();
    updateMetrics();
    DOM.scalebar.textContent =
      `domain ${S.Lz.toFixed(0)} × ${(2*S.Rmax).toFixed(0)} mm   grid ${S.Nz} × ${S.Nr}   ` +
      `cell ${S.dz.toFixed(2)} × ${S.dr.toFixed(2)} mm`;
  }

  const steps = OPT.autoPace ? Math.max(1, Math.round(S.spfAuto)) : P.spf;
  hud.textContent =
    `t = ${S.t.toFixed(1)} ms   dt = ${(S.dt*1000).toFixed(1)} µs   ` +
    `max |u| = ${S.vmax.toFixed(1)} m/s\n` +
    `piston  x = ${S.pistonX.toFixed(1)} mm   v = ${S.pistonV.toFixed(2)} m/s` +
    (S.firing ? '   ▶ pushing' : '   ■ coasting') + `\n` +
    `${fps.toFixed(0)} fps   ${steps} steps/frame   ` +
    `${S.simRate.toFixed(1)} ms of flight per second\n` +
    (WG.ok
      ? `WebGPU compute   ${(steps*(7 + P.iters)).toLocaleString()} dispatches/frame, 1 submit`
      : `WebGL2 fragment   ${(steps*(P.iters+6)).toLocaleString()} passes/frame @ ${S.passUs.toFixed(0)} µs`);

  requestAnimationFrame(frame);
}

function flagDivergence(v){
  S.diverged = true; S.running = false;
  DOM.pause.textContent = 'Run';
  const el = document.getElementById('diverged');
  el.style.display = 'block';
  el.innerHTML = `<b>The run diverged.</b> Peak velocity reached ` +
    (Number.isFinite(v) ? `${v.toFixed(0)} m/s` : 'a non-finite value') +
    `, which means the pressure solve stopped enforcing mass conservation. ` +
    `Raise <b>pressure iterations</b>, or lower the <b>CFL number</b>, then fire again.`;
}

(async function boot(){
  const usedGPU = await wgpuInit();
  if (usedGPU){
    document.getElementById('view').style.display = 'none';
    WG.canvas.style.display = 'block';
  }
  buildGrid();
  S.passUs = usedGPU ? 0 : measurePassCost();
  S.backend = usedGPU ? 'WebGPU compute' : 'WebGL2 fragment';
  updateMetrics();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
